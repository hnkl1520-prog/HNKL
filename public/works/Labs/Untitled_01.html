<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Fixed Elastic Particles</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI 패널 - 글래스모피즘 효과 적용 */
        #gui {
            position: absolute; 
            bottom: 30px; /* 중앙 하단 배치 */
            left: 50%;
            transform: translateX(-50%);
            
            /* 글래스모피즘 핵심 속성 */
            background: rgba(255, 255, 255, 0.05); /* 매우 옅은 반투명 배경 */
            backdrop-filter: blur(12px); /* 배경 블러 처리 (유리 효과) */
            -webkit-backdrop-filter: blur(12px); /* 사파리 호환성 */
            border: 1px solid rgba(255, 255, 255, 0.1); /* 미세한 흰색 테두리 */
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); /* 입체감을 위한 그림자 */
            
            padding: 20px; 
            border-radius: 12px; /* 유리 느낌을 살리는 둥근 모서리 */
            color: #eee;
            z-index: 10; 
            width: 260px;
        }
        
        #gui h3 { margin: 0 0 15px 0; font-size: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.15); padding-bottom: 10px; color: #fff;}
        .control-group { margin-bottom: 15px; }
        .control-group:last-child { margin-bottom: 0; }
        label { display: flex; justify-content: space-between; font-size: 11px; color: #ccc; margin-bottom: 5px; }
        
        /* 슬라이더(range) 바 색상을 파란색(#2b50f1)으로 변경 */
        input[type=range] { 
            width: 100%; 
            display: block; 
            cursor: pointer; 
            accent-color: #2b50f1; 
        }
        
        .val-display { color: #00f0ff; font-weight: bold; }
        
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 20px; pointer-events: none; z-index: 20;
        }
    </style>
</head>
<body>
    <div id="loading">카메라 연결 중...</div>
    <video id="video" autoplay muted playsinline style="display:none;"></video>
    <canvas id="canvas1"></canvas>
    
    <div id="gui">
        <h3>Parameters</h3>
        
        <div class="control-group">
            <label>GRID DENSITY (SPACING) <span id="val-gap">10</span></label>
            <input type="range" id="in-gap" min="4" max="40" value="10" step="1">
        </div>

        <div class="control-group">
            <label>PARTICLE SIZE <span id="val-size">6.1</span></label>
            <input type="range" id="in-size" min="0.5" max="10" value="6.1" step="0.1">
        </div>
    </div>

    <script>
        // 요청하신 초기 파라미터 값 설정
        const config = {
            force: 20.0,
            speed: 0.15,
            friction: 0.81,
            thresh: 15,
            gap: 10,
            size: 6.1
        };

        const canvas = document.getElementById('canvas1');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const video = document.getElementById('video');
        const loading = document.getElementById('loading');
        
        const tempCanvas = document.createElement('canvas');
        const tempCtx = tempCanvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        let isReady = false;

        // UI 이벤트 리스너
        document.getElementById('in-gap').oninput = function(e) {
            config.gap = parseInt(e.target.value);
            document.getElementById('val-gap').innerText = config.gap;
            if(isReady) initParticles(); 
        };
        document.getElementById('in-size').oninput = function(e) {
            config.size = parseFloat(e.target.value);
            document.getElementById('val-size').innerText = config.size.toFixed(1);
        };

        // 카메라 켜기
        navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
            video.srcObject = stream;
            video.play();
        })
        .catch(e => {
            console.error(e);
            loading.innerText = "카메라 권한을 허용해주세요.";
        });

        video.addEventListener('loadeddata', () => {
            if(!isReady) {
                isReady = true;
                loading.style.display = 'none';
                initParticles();
                animate();
            }
        });

        class Particle {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.baseX = x; this.baseY = y;
                this.vx = 0; this.vy = 0;
                this.color = 'rgba(0,0,0,0)';
                this.prevBright = 0;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, config.size, config.size);
            }

            update(pixelData, width, scale) {
                const vx = Math.floor(this.baseX / scale);
                const vy = Math.floor(this.baseY / scale);
                const index = (vy * width + vx) * 4;

                let r = pixelData[index];
                let g = pixelData[index+1];
                let b = pixelData[index+2];

                let bright = (r + g + b) / 3;
                
                if (bright < 30) this.color = 'rgba(0,0,0,0)';
                else this.color = `rgb(${r},${g},${b})`;

                let diff = Math.abs(bright - this.prevBright);
                this.prevBright = bright;

                if (diff > config.thresh) {
                    const angle = Math.random() * 6.28;
                    this.vx += Math.cos(angle) * config.force;
                    this.vy += Math.sin(angle) * config.force;
                }

                this.vx += (this.baseX - this.x) * config.speed; 
                this.vy += (this.baseY - this.y) * config.speed;

                this.vx *= config.friction; 
                this.vy *= config.friction;

                this.x += this.vx;
                this.y += this.vy;
            }
        }

        function initParticles() {
            particles = [];
            const w = canvas.width;
            const h = canvas.height;
            for (let y = 0; y < h; y += config.gap) {
                for (let x = 0; x < w; x += config.gap) {
                    particles.push(new Particle(x, y));
                }
            }
        }

        const procRes = 320; 

        function animate() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            tempCanvas.width = procRes;
            tempCanvas.height = procRes * (video.videoHeight / video.videoWidth);
            tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
            const pData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height).data;
            const scale = canvas.width / procRes;

            for(let i=0; i<particles.length; i++){
                particles[i].update(pData, tempCanvas.width, scale);
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        });
    </script>
</body>
</html>
