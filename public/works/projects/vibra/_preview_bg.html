<!doctype html><html lang="ko"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBRA — XR Football Broadcasting Platform</title>

    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <!-- 디자인 토큰 → 공통 스타일 (tokens.css 가 먼저) -->
    <link rel="stylesheet" href="../../../tokens.css">
    <link rel="stylesheet" href="../../../common.css">

    <!-- GSAP (스크롤 등장 애니메이션) + ScrollTrigger 플러그인 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        /* =========================================================
           VIBRA Detail — 디자인 시스템 적용
           검정 배경 + 흑백(회색 스케일). 색/타이포/간격은 common.css의
           --gray-* / --fs-* / --space-* 토큰을 참조. (핑크 포인트 제거)
           남은 --vb-* 는 이 페이지 고유의 레이아웃 리듬값(폭/패딩)만.
           ========================================================= */
        :root {
            /* 색은 디자인 시스템 토큰으로 매핑 (기본 라이트 = 흰 배경 + 검정 글씨) */
            --vb-bg: #ffffff;                 /* 페이지 베이스 흰색 */
            --vb-panel: var(--panel);          /* 면·카드 → 역할토큰 */
            --vb-line: var(--gray-20);        /* 테두리 — 메인 페이지보다 한 단계 진함 */
            --vb-text: var(--text-color);     /* 제목·강조 → 역할토큰 */
            --vb-body: var(--text-sub);       /* 본문 보조 → 역할토큰 */
            --vb-muted: var(--label-color);   /* 캡션·라벨 → 역할토큰 */

            /* 페이지 고유 레이아웃 리듬 (반응형 대비 clamp) */
            --vb-pad-block: clamp(80px, 11vw, 180px);
            --vb-pad-inline: clamp(24px, 6vw, 100px);
            --vb-maxw: 1280px;
            --vb-gap: var(--space-md);        /* 그리드 기본 간격 = 32px */
        }

        .dark-mode {
            --vb-line: var(--gray-80);        /* 라이트 gray-20 의 다크 대응 */
        }

        /* common.css의 main 기본 패딩 무력화 (히어로 풀스크린을 위해) */
        body {
            background-color: var(--vb-bg);
            color: var(--vb-text);
            font-family: 'Pretendard', sans-serif;
            /* overflow-x 미설정: body에 overflow를 주면 sticky/스크롤 기준이 꼬여
               히어로 sticky가 깨짐. 이 레이아웃은 가로 넘침이 없어 불필요. */
        }
        main { padding: 0; min-height: auto; }

        /* =========================================================
           공통 레이아웃 유틸 (vb- 접두사로 common.css와 충돌 방지)
           ========================================================= */
        .vb-section {
            padding-block: var(--vb-pad-block);
            padding-inline: var(--vb-pad-inline);
        }
        .vb-wrap {
            max-width: var(--vb-maxw);
            margin-inline: auto;
        }
        /* 콘텐츠 타이포: 디자인 시스템 스케일(--fs-*) 사용 */
        .vb-eyebrow {
            display: inline-block;
            color: var(--vb-muted);
            font-weight: 600;
            font-size: var(--fs-caption);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            margin: 0 0 var(--space-sm);
        }
        .vb-title {           /* 섹션 메인 제목 = h1 스케일 */
            font-size: var(--fs-h1);
            font-weight: 600;
            line-height: 1.25;          /* 한글 제목 보강 */
            letter-spacing: -0.015em;
            color: var(--vb-text);
            word-break: keep-all;
            margin: 0 0 var(--space-md);
        }
        .vb-subtitle {        /* = h3 스케일 */
            font-size: var(--fs-h3);
            font-weight: 600;
            line-height: 1.4;
            color: var(--vb-text);
            margin: 0 0 18px;
        }
        .vb-body {
            font-size: var(--fs-body);
            line-height: 1.7;
            color: var(--vb-body);
            word-break: keep-all;
            max-width: 60ch;
        }
        .vb-body + .vb-body { margin-top: 1em; }

        /* =========================================================
           Placeholder 박스 (이미지/영상 자리)
           나중에 박스 자리에 실제 미디어를 채움
           ========================================================= */
        .ph {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background-color: var(--vb-panel);
            background-image:
                repeating-linear-gradient(45deg,
                    rgba(255, 255, 255, 0.018) 0,
                    rgba(255, 255, 255, 0.018) 1px,
                    transparent 1px,
                    transparent 11px);
            border: 1px dashed var(--vb-line);
            border-radius: 16px;
            overflow: hidden;
            color: var(--vb-muted);
        }
        .ph__label {
            font-size: var(--fs-caption);
            font-weight: 500;
            letter-spacing: 0.04em;
            text-align: center;
            padding: 12px 18px;
            color: var(--vb-muted);
        }
        .ph__label::before {
            content: "◻";
            display: block;
            font-size: 1.4rem;
            color: var(--vb-muted);
            margin-bottom: 8px;
        }
        /* 비율 modifier */
        .ph--21x9 { aspect-ratio: 21 / 9; }
        .ph--16x9 { aspect-ratio: 16 / 9; }
        .ph--3x2  { aspect-ratio: 3 / 2; }
        .ph--4x3  { aspect-ratio: 4 / 3; }
        .ph--1x1  { aspect-ratio: 1 / 1; }
        .ph--3x4  { aspect-ratio: 3 / 4; }
        .ph--fill { position: absolute; inset: 0; border-radius: 0; border: none; }

        /* =========================================================
           1. HERO STAGE (Apple Vision Pro 스타일 스크롤 레이어)
           ========================================================= */
        /* .vb-stage = 히어로(sticky) + 그 위를 덮으며 올라오는 레이어를 품음.
           sticky 기반이라 JS 없이도 동작 → 무조건 렌더됨 */
        .vb-stage {
            position: relative;
        }
        .vb-hero {
            position: sticky;          /* 스크롤 동안 화면에 고정 */
            top: 0;
            height: 100vh;
            min-height: 600px;
            overflow: hidden;          /* 더미 그라데이션 클립 */
        }
        /* 더미 키비주얼: 실제 이미지 넣기 전 더미 사진으로 대체
           (디테일이 있어야 프로스티드 블러가 어떻게 들어가는지 구분됨)
           → 나중에 url(...) 부분만 실제 키비주얼 경로로 교체 */
        .vb-hero--dummy {
            background: #1a1a1a url("https://picsum.photos/seed/vibra/1920/1080") center / cover no-repeat;
        }
        .vb-hero--dummy .ph__label {
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
        }

        /* 레이어: 일반 흐름에서 sticky 히어로 위로 스크롤되어 올라옴.
           DOM상 히어로보다 뒤 → 자연히 히어로 위에 그려짐 (Vision Pro식 덮기) */
        .vb-cover {
            position: relative;
            z-index: 5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 프로스티드 블러 (뒤의 sticky 히어로가 흐릿하게 비침) */
            background: rgba(255, 255, 255, 0.72);
            -webkit-backdrop-filter: blur(24px) saturate(1.2);
            backdrop-filter: blur(24px) saturate(1.2);
            border-top: 1px solid var(--vb-line);
        }
        .vb-cover__inner {
            width: 100%;
            max-width: 820px;
            padding: clamp(40px, 7vh, 96px) var(--vb-pad-inline);
        }
        .vb-cover__inner .vb-subtitle + .vb-body { margin-top: 12px; }

        /* =========================================================
           2. INFO
           ========================================================= */
        .vb-info-grid {
            display: grid;
            grid-template-columns: minmax(280px, 0.9fr) minmax(240px, 0.7fr);
            gap: clamp(40px, 6vw, 96px);
            align-items: start;
        }
        .vb-meta { display: flex; flex-direction: column; gap: 22px; }
        .vb-meta__row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--vb-line);
        }
        .vb-meta__key { color: var(--vb-muted); font-size: 0.9rem; letter-spacing: 0.03em; }
        .vb-meta__val { color: var(--vb-text); font-weight: 600; font-size: 0.95rem; text-align: right; }

        /* Contribution 70% 옆 작은 토글 버튼 */
        .vb-meta__val { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
        .vb-toggle-btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 0; border: none; background: none;
            color: var(--vb-muted); cursor: pointer;
            transition: color 0.2s ease;
        }
        .vb-toggle-btn:hover { color: var(--vb-text); }
        .vb-toggle-btn:focus { outline: none; }
        .vb-toggle-btn:focus-visible { outline: 2px solid var(--vb-text); outline-offset: 2px; border-radius: 4px; }
        .vb-toggle__icon {
            display: inline-block; font-size: 1.15rem; line-height: 1;
            transition: transform 0.35s ease;
        }
        .vb-toggle-btn[aria-expanded="true"] .vb-toggle__icon { transform: rotate(180deg); }

        /* 접힘/펼침 (grid-template-rows 0fr→1fr 기법으로 높이 부드럽게) */
        .vb-roles-wrap {
            display: grid; grid-template-rows: 0fr;
            transition: grid-template-rows 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .vb-roles-wrap.is-open { grid-template-rows: 1fr; }
        .vb-roles-inner { overflow: hidden; }

        /* Role 막대 (실제 데이터 시각화 — placeholder 아님) */
        /* 폭을 줄여 Contribution '70%'의 시작점에서 끝나도록 정렬 */
        .vb-roles { margin-top: 18px; display: flex; flex-direction: column; gap: 14px; width: calc(100% - 3em); }
        .vb-role__head {
            display: flex; justify-content: space-between;
            font-size: 0.85rem; margin-bottom: 7px;
        }
        .vb-role__name { color: var(--vb-text); font-weight: 500; }
        .vb-role__pct { color: var(--vb-text); font-weight: 600; }
        .vb-bar { height: 6px; border-radius: 99px; background: var(--vb-line); overflow: hidden; }
        .vb-bar__fill {
            height: 100%; width: 0; border-radius: 99px; background: var(--vb-text);
            transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .vb-credits { display: flex; flex-direction: column; gap: var(--space-md); }
        .vb-credit__label {
            font-size: 0.78rem; text-transform: uppercase;
            letter-spacing: 0.1em; color: var(--vb-muted); margin-bottom: 10px;
        }
        /* 크레딧 로고 (PNG) */
        .vb-logos { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; }
        .vb-logo {
            height: 64px; width: auto; max-width: 280px;
            object-fit: contain;
            opacity: 0.85;
            transition: opacity 0.2s ease;
        }
        .vb-logo:hover { opacity: 1; }

        .vb-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .vb-chip {
            padding: 7px 14px; border-radius: 99px;
            border: 1px solid var(--vb-line); background: transparent;
            color: var(--vb-text);
            font-size: 0.85rem; font-weight: 500;
        }

        /* =========================================================
           공통 카드 / 그리드
           ========================================================= */
        .vb-grid { display: grid; gap: var(--vb-gap); }
        .vb-grid--2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .vb-grid--3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
        .vb-grid--4 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

        .vb-card {
            background: var(--vb-panel);
            border: 1px solid var(--vb-line);
            border-radius: 16px;
            padding: var(--space-md);
        }
        .vb-card__tag {
            display: inline-block; font-size: 0.75rem; font-weight: 600;
            color: var(--vb-muted); letter-spacing: 0.08em; margin-bottom: 12px;
        }
        .vb-card h3 { margin: 0 0 12px; font-size: var(--fs-h3); font-weight: 600; color: var(--vb-text); }
        .vb-card p { margin: 0; font-size: var(--fs-body); line-height: 1.7; color: var(--vb-body); word-break: keep-all; }

        .vb-group { margin-top: var(--space-lg); }
        .vb-group:first-of-type { margin-top: 0; }
        .vb-group__head {
            display: flex; align-items: baseline; gap: 14px; margin-bottom: var(--space-sm);
        }
        .vb-group__num { color: var(--vb-text); font-weight: 700; font-size: 0.95rem; }
        .vb-group__name { font-size: var(--fs-h3); font-weight: 600; color: var(--vb-text); }

        .vb-caption {
            margin-top: 12px; font-size: var(--fs-caption); color: var(--vb-muted); letter-spacing: 0.02em;
        }

        /* UX Direction 키워드 */
        .vb-keyword {
            background: var(--vb-panel);
            border: 1px solid var(--vb-line);
            border-radius: 14px;
            padding: 26px 22px;
            text-align: center;
        }
        .vb-keyword__idx { color: var(--vb-muted); font-size: 0.8rem; font-weight: 700; }
        .vb-keyword__name { margin-top: 10px; font-size: var(--fs-body); font-weight: 600; color: var(--vb-text); }

        /* Service Flow */
        .vb-flow {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: var(--vb-gap);
        }
        .vb-flow__step { position: relative; }
        .vb-flow__phase {
            display: inline-block; color: var(--vb-text); font-weight: 700;
            font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 14px;
        }

        /* =========================================================
           데이터 카드 (Quantitative Research) — 수치·인용·출처 + CSS 도넛
           ========================================================= */
        .qr-card {
            /* ▼▼▼ 조절 패널 - 작업용: 이 변수들을 하단 슬라이더가 실시간 덮어씀 ▼▼▼
               (확정되면 이 기본값을 디자인 토큰/고정값으로 옮기면 됨) */
            --qr-gap-num: 24px;      /* 번호 → 인용문 간격 */
            --qr-gap-quote: 4px;     /* 인용문 → 출처 간격 */
            --qr-gap-source: 64px;   /* 출처 → 도넛 간격 */
            --qr-donut-size: 181px;  /* 도넛 지름 */
            --qr-donut-legend-gap: 20px; /* 도넛 → 범례 간격 */
            --qr-legend-item-gap: 4px;   /* 범례 항목(줄)끼리 간격 */
            --qr-legend-offset: 80px;     /* 범례 세로 위치 미세조정(+아래/−위) */
            --qr-donut-gap: 35px;    /* 도넛 쌍 사이 세로 간격 */
            --qr-pad: 40px;          /* 카드 안쪽 여백 */
            --qr-maxw: 658px;        /* 카드 최대 너비 */
            /* ▲▲▲ 조절 패널 - 작업용 ▲▲▲ */

            background: var(--vb-panel);            /* 연한 회색 면 (--panel) */
            border: 1px solid var(--vb-line);
            border-radius: 18px;
            padding: var(--qr-pad);
            display: flex;
            flex-direction: column;                 /* 간격은 자식 margin-top으로 개별 제어 */
        }

        /* 카드 그리드 2:1 — 도넛 2개 카드(넓게) : 도넛 1개 카드(좁게) */
        .qr-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: var(--vb-gap);
            align-items: stretch;                   /* 같은 줄 카드 높이 맞춤 */
            margin-bottom: var(--space-xl);         /* 다음 섹션과 충분한 간격 (겹침 방지) */
        }
        @media (max-width: 768px) {
            .qr-grid { grid-template-columns: 1fr; } /* 좁은 화면: 전부 1열 */
        }
        .qr-card__num {
            display: inline-block;
            font-size: var(--fs-h3);
            font-weight: 700;
            color: var(--accent-color);            /* 포인트 컬러 */
            letter-spacing: 0.02em;
        }
        .qr-card__quote {
            margin: var(--qr-gap-num) 0 0;          /* 번호 → 인용문 */
            font-size: var(--fs-h3);
            font-weight: 600;
            line-height: 1.5;
            color: var(--vb-text);
            word-break: keep-all;
            text-indent: -0.45em;                   /* 여는 따옴표를 왼쪽으로 매달기 → 본문 첫 글자가 번호·출처와 같은 선에서 시작 */
        }
        .qr-card__source {
            margin: var(--qr-gap-quote) 0 0;        /* 인용문 → 출처 */
            font-size: var(--fs-caption);
            font-style: normal;
            color: var(--vb-muted);
            line-height: 1.5;
        }

        /* 도넛 영역: 도넛+범례 쌍을 가로로 나란히 (좁으면 자동 줄바꿈) */
        .qr-card__data {
            flex: 1 1 auto;                         /* 남는 높이 차지 → 도넛을 바닥에 붙임 */
            display: flex;
            flex-wrap: wrap;                        /* 칸 좁아지면 아래로 떨어짐 */
            align-items: flex-end;                  /* 도넛을 카드 바닥 기준 정렬 (두 카드 도넛 높이 일치) */
            gap: var(--qr-donut-gap);               /* 도넛 쌍 사이 간격 */
            margin-top: var(--qr-gap-source);       /* 출처 → 도넛 (최소 간격) */
        }
        .qr-stat { flex: 1 1 0; }                   /* 두 쌍이 칸을 고르게 나눠 가짐 */
        /* 재사용 단위: 도넛(좌) + 범례(우) 가로 배치 */
        .qr-stat {
            display: flex;
            align-items: flex-start;                /* 범례를 도넛 위쪽 기준 정렬 → 여러 범례 시작 높이 동일 */
            gap: var(--qr-donut-legend-gap);        /* 도넛 → 범례 간격 */
        }

        /* SVG 도넛 — 색 끝 둥글게(stroke-linecap) + 차오름 애니메이션(stroke-dashoffset).
           둘레를 100으로 맞춘 원(r=15.9155)이라 dash 값 = 퍼센트로 바로 대응 */
        .qr-donut {
            --size: var(--qr-donut-size);           /* 도넛 지름 (조절 패널 제어) */
            --stroke: 3.6;                          /* 링 두께 (viewBox 36 기준) */
            --fill: var(--accent-color);            /* 채움: 포인트 파랑 */
            --fill-2: color-mix(in srgb, var(--accent-color) 40%, #fff); /* 두번째 구간(연한 파랑) */
            --track: var(--vb-line);                /* 빈 부분: 테두리와 동일 톤 */
            position: relative;
            flex-shrink: 0;                         /* 좁은 칸에서도 원형 유지 */
            width: var(--size);
            height: var(--size);
            display: grid;
            place-items: center;
        }
        .qr-donut svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        .qr-donut circle { fill: none; stroke-width: var(--stroke); }
        .qr-donut__track { stroke: var(--track); }
        .qr-donut__arc {
            stroke: var(--fill);
            stroke-linecap: round;                  /* 색 부분 끝 둥글게 */
            stroke-dasharray: 100;                  /* 둘레 = 100 */
            stroke-dashoffset: 100;                 /* 초기: 완전히 빈 상태 */
            /* 시작점을 12시로: 각 구간 시작%(--start)만큼 추가 회전 */
            transform: rotate(calc((var(--start, 0) * 3.6 - 90) * 1deg));
            transform-origin: center;
            transform-box: fill-box;
