}

async function start() {
  const session=++state.session;
  startButton.disabled = true;
  introNote.textContent = introNoteText; introNote.removeAttribute('role');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showIntroError('이 주소에서는 브라우저가 카메라를 막아요. https 주소로 열거나, 파일을 크롬에서 직접 열어 주세요.');
    return;
  }
  state.phase = 'camera'; state.error = '';
  state.startedAt = performance.now();
  intro.hidden = true;
  loadingEl.hidden = false;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 960 }, height: { ideal: 540 },frameRate:{ideal:30,max:30} }, audio: false });
    if(session!==state.session){stream.getTracks().forEach(t=>t.stop());return;}
    video.srcObject = stream;
    for(const track of stream.getVideoTracks())track.addEventListener('ended',()=>{
      if(session!==state.session)return;stop();showIntroError('카메라 연결이 끊겼어요. 연결을 확인한 뒤 다시 눌러 주세요.');
    });
    await video.play();
  } catch (e) {
    if(session!==state.session)return;
    const stream = video.srcObject;
    if (stream) { stream.getTracks().forEach((t) => t.stop()); video.srcObject = null; }  // 다시 시도할 때 카메라가 두 번 열리지 않게
    const name = e && e.name;
    showIntroError(
      name === 'NotAllowedError' || name === 'SecurityError' ? '카메라 권한이 막혀 있어요. 주소창 왼쪽의 사이트 설정에서 카메라를 허용한 뒤 다시 눌러 주세요.'
        : name === 'NotFoundError' || name === 'OverconstrainedError' ? '연결된 카메라를 찾지 못했어요. 카메라를 연결한 뒤 다시 눌러 주세요.'
          : name === 'NotReadableError' ? '다른 앱이 카메라를 쓰고 있어요. 그 앱을 닫고 다시 눌러 주세요.'
            : '카메라를 열 수 없어요. 새로고침한 뒤 다시 눌러 주세요.');
    return;
  }
  intro.hidden = true;
  if(session!==state.session)return;
  state.phase = 'tracker';
  let fileset;
  try {
    fileset = await FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
    if(session!==state.session)return;
    initSegmenter(fileset); // 헤어/옷 모델을 얼굴 모델과 함께 준비한다.
    const make = (delegate) => FaceLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: FACE_MODEL, delegate }, runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true,
    });
    // 진단용 inspect&cpu에서만 CPU를 강제할 수 있다. 일반 사용은 GPU→CPU 순서.
    const params = new URLSearchParams(location.search);
    const cpu=params.has('inspect')&&params.has('cpu');
    const mainFallback=async()=>{
      let tracker;try{tracker=await make(cpu?'CPU':'GPU');}catch{tracker=await make('CPU');}
      if(session!==state.session){tracker.close();return null;}
      tracker.mode='main';return tracker;
    };
    state.trackerAbort=new AbortController();
    let tracker;
    try{
      tracker=await OddTracking.create({mpBase:MP_BASE,model:FACE_MODEL,cpu,signal:state.trackerAbort.signal,
        onResult:(result,at,ms)=>{if(session!==state.session||state.phase!=='running')return;state.trackingMs=ms;onLandmarks(result,performance.now());},
        onError:async e=>{if(session!==state.session)return;console.warn('얼굴 워커 대체 실행',e);state.landmarker=null;try{state.landmarker=await mainFallback();}catch{stop();showIntroError('얼굴 분석이 중단됐어요. 다시 시작해 주세요.');}}
      });
    }catch(e){if(session!==state.session)return;console.warn('얼굴 워커 준비 실패, 대체 실행',e);tracker=await mainFallback();}
    if(session!==state.session){tracker.close();return;}state.landmarker=tracker;
    initGlassesWorker();
  } catch (e) {
    if(session!==state.session)return;
    state.seg.worker?.terminate();state.seg.main?.close();Object.assign(state.seg,{mode:'failed',worker:null,main:null,busy:false,pending:null});
    if (video.srcObject) { video.srcObject.getTracks().forEach(t=>t.stop()); video.srcObject=null; }
    showIntroError('얼굴을 읽는 도구를 준비하지 못했어요. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.');
    return;
  }
  state.phase = 'running';
}

// ── 머리카락 분할: 워커에서 먼저, 안 되면 같은 스레드에서 ──
function extractMasks(masks, S) {
  const grab = (k) => {
    const m = masks[k], src = m.getAsFloat32Array(), w = m.width, h = m.height, out = new Float32Array(S * S);
    if (w === S && h === S) { out.set(src); return out; }
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) out[y * S + x] = src[Math.floor((y * h) / S) * w + Math.floor((x * w) / S)];
    return out;
  };
  return { hair: grab(1), body: grab(2), face: grab(3), clothes:grab(4), others: grab(5) };
}

const WORKER_SRC = `
${extractMasks.toString()}
let seg = null,FilesetResolver,ImageSegmenter;
self.onmessage = async (ev) => {
  const d = ev.data;
  if (d.type === 'init') {
    try {
      ({FilesetResolver,ImageSegmenter}=await import('${MP_BASE}/vision_bundle.mjs'));
      const fileset = await FilesetResolver.forVisionTasks('${MP_BASE}/wasm', ${location.protocol!=='file:'});
      seg = await ImageSegmenter.createFromOptions(fileset, { baseOptions: { modelAssetPath: d.model, delegate: 'CPU' }, runningMode: 'IMAGE', outputConfidenceMasks: true, outputCategoryMask: false });
      self.postMessage({ type: 'ready', labels: seg.getLabels ? seg.getLabels() : null });
    } catch (e) { self.postMessage({ type: 'fail', message: String((e && e.message) || e) }); }
    return;
  }
  if (d.type === 'segment') {
    try {
      const img = new ImageData(new Uint8ClampedArray(d.buffer), d.size, d.size);
      let out = null;
      seg.segment(img, (r) => { if (r.confidenceMasks && r.confidenceMasks.length >= 6) out = extractMasks(r.confidenceMasks, d.size); });
      if (!out) throw new Error('empty masks');
      self.postMessage({ type: 'result', id: d.id, masks: out }, [out.hair.buffer, out.body.buffer, out.face.buffer, out.clothes.buffer, out.others.buffer]);
    } catch (e) { self.postMessage({ type: 'fail', id: d.id, message: String((e && e.message) || e) }); }
  }
};`;

function initSegmenter(fileset) {
  const seg = state.seg,session=state.session;
  const fallback = (seg.fallback = (why) => {
    if(session!==state.session)return;
    if(seg.mode==='failed')return;
    console.warn('헤어·옷 분석 보류:',why);
    seg.worker?.terminate();seg.worker=null;seg.main?.close();seg.main=null;
    // 실패한 분석을 UI 스레드로 옮겨 화면 전체를 멈추게 하지 않는다.
    seg.mode='failed';seg.busy=false;seg.pending=null;
  });
  try {
    const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }));
    const worker = new Worker(url, { type: location.protocol==='file:'?'classic':'module' });
    seg.worker = worker;
    const initTimer = setTimeout(() => fallback('시간 초과'), 25000);
    worker.onmessage = (ev) => {
      if (seg.worker !== worker) return;  // 시간 초과로 이미 버린 워커
      const d = ev.data;
      if (d.type === 'ready') { clearTimeout(initTimer); seg.mode = 'worker'; seg.labels = d.labels; }
      else if (d.type === 'result') onSegResult(d.id, d.masks);
      else if (d.type === 'fail') { clearTimeout(initTimer); fallback(d.message); }
    };
    worker.onerror = (e) => { if (seg.worker !== worker) return; clearTimeout(initTimer); fallback(e.message || 'worker error'); };
    worker.postMessage({ type: 'init', model: SEG_MODEL });
  } catch (e) { fallback(e.message); }
}

function segReady() { return state.seg.mode === 'worker' || state.seg.mode === 'main'; }

function initGlassesWorker(){
  // 경계 탐색·렌즈 맞춤도 UI 스레드 밖에서 실행. 워커 불가 시 임의 안경을 만들지 않는다.
  const functions=[blur1,boxBlur,ridgeMap,pointInPoly,inflatePoly,fillPolyMask,dilateMask,glassesEvidence,circularPath,fitLensShape,createGlassesState,glassesUpdate,lensMix];
  const source=`const GL=${JSON.stringify(GL)},LM=${JSON.stringify(LM)},GL_GROUPS=${JSON.stringify(GL_GROUPS)},GL_VALID=${GL_VALID};
    const clamp=${clamp},lerp=${lerp},smoothstep=${smoothstep},glX=${glX},glY=${glY};
    ${functions.map(f=>f.toString()).join('\n')}
    self.onmessage=({data:d})=>{try{const ev=glassesEvidence(d.gray,d.F);glassesUpdate(d.glasses,ev,d.dt,d.now);self.postMessage({id:d.id,epoch:d.epoch,glasses:d.glasses,detail:ev.detail});}catch(e){self.postMessage({error:String(e)});}};`;
  let url;
  try{
    url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));
    const worker=new Worker(url);URL.revokeObjectURL(url);state.glassesWorker=worker;
    worker.onmessage=({data:d})=>{
      if(state.glassesWorker!==worker)return;state.glassesBusy=false;
      if(d.error){console.warn('안경 분석 보류',d.error);worker.terminate();state.glassesWorker=null;return;}
      const p=state.person;if(!p||p.phase!=='scan'||p.id!==d.id||p.epoch!==d.epoch)return;
      p.glasses=d.glasses;p.lastEvidence=d.detail;
    };
    worker.onerror=()=>{if(state.glassesWorker!==worker)return;worker.terminate();state.glassesWorker=null;state.glassesBusy=false;};
  }catch(e){if(url)URL.revokeObjectURL(url);state.glassesWorker=null;console.warn('안경 워커를 사용할 수 없음',e);}
}

function requestSegment(person, pose, now) {
  if (person.phase !== 'scan') return; // 헤어는 초기/재스캔 때만 읽고 이후 고정
  const seg = state.seg, S = HAIR.segPx, vw = video.videoWidth, vh = video.videoHeight;
  if (seg.busy) {
    if (seg.mode === 'worker' && now - seg.sentAt > 8000) seg.fallback('응답 없음');
    return;
  }
  const kind=person.segCount<2&&(person.segCount<=person.clothesCount||person.clothesCount>=2)?'hair':'clothes';
  let clothMeta=null,clothCrop=null;
  segCtx.setTransform(1, 0, 0, 1, 0, 0);
  segCtx.fillStyle = '#d9d7d1'; segCtx.fillRect(0, 0, S, S);
  if(kind==='clothes'){
    const P=state.P,fw=Math.max(30,Math.hypot(P[3*454]-P[3*234],P[3*454+1]-P[3*234+1]));
    const cx=(P[3*234]+P[3*454])/2,ey=(P[3*33+1]+P[3*263+1])/2,side=fw*3.8;
    clothCrop={x:cx-side/2,y:ey-fw*1.45,side};
    clothMeta={faceWidth:fw/side*S,centerX:S/2,chinY:(P[3*152+1]-clothCrop.y)/side*S,left:Math.max(0,-clothCrop.x/side*S),right:Math.min(S,(vw-clothCrop.x)/side*S),bottom:Math.min(S,(vh-clothCrop.y)/side*S)};
    segCtx.setTransform(S/side,0,0,S/side,-clothCrop.x*S/side,-clothCrop.y*S/side);
  }else segCtx.setTransform(...headCropTransform(pose, HAIR.x0, HAIR.x1, HAIR.y0, HAIR.y1, S, S, HAIR.zcm));
  segCtx.drawImage(video, 0, 0, vw, vh);
  segCtx.setTransform(1, 0, 0, 1, 0, 0);
  const img = segCtx.getImageData(0, 0, S, S);
  const valid = new Uint8Array(S * S), cs = (HAIR.x1 - HAIR.x0) / S;
  // 머리 좌표 → 이미지는 선형이라 기준점 하나와 한 칸 이동량으로 계산
  const [p0x, p0y] = headToImage(pose, HAIR.x0 + 0.5 * cs, HAIR.y0 + 0.5 * cs, HAIR.zcm);
  const [pxx, pxy] = headToImage(pose, HAIR.x0 + 1.5 * cs, HAIR.y0 + 0.5 * cs, HAIR.zcm), [pyx, pyy] = headToImage(pose, HAIR.x0 + 0.5 * cs, HAIR.y0 + 1.5 * cs, HAIR.zcm);
  const ax = pxx - p0x, ay = pxy - p0y, bx = pyx - p0x, by = pyy - p0y;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const px = clothCrop?clothCrop.x+(x+.5)/S*clothCrop.side:p0x + ax * x + bx * y, py = clothCrop?clothCrop.y+(y+.5)/S*clothCrop.side:p0y + ay * x + by * y;
    valid[y * S + x] = px >= 0 && py >= 0 && px < vw && py < vh ? 1 : 0;
  }
  const id = seg.nextId++;
  seg.pending = { id, kind,clothMeta,personId: person.id, epoch: person.epoch, rgb: Uint8ClampedArray.from(img.data), valid, angleW: Math.max(0.1, Math.exp(-(pose.yaw ** 2 + pose.pitch ** 2) / (2 * 0.18 * 0.18))) };
  seg.busy = true; seg.sentAt = now;
  person.lastSeg = now;
  if (seg.mode === 'worker') {
    const buf = img.data.buffer;  // 색 계산용 사본(rgb)은 위에서 따로 떴으므로 원본은 그대로 넘김
    seg.worker.postMessage({ type: 'segment', id, size: S, buffer: buf }, [buf]);
  } else {
    try {
      let out = null;
      seg.main.segment(img, (r) => { if (r.confidenceMasks && r.confidenceMasks.length >= 6) out = extractMasks(r.confidenceMasks, S); });
      onSegResult(id, out);
    } catch (e) { seg.busy = false; seg.mode = 'failed'; console.error('segment', e); }
  }
}

function onSegResult(id, masks) {
  const seg = state.seg, pend = seg.pending, now = performance.now();
  if (!pend || pend.id !== id) return;
  seg.busy = false;
  seg.pending = null;
  if (!masks) return;
  const p = state.person;
  if (!p || p.phase !== 'scan' || p.id !== pend.personId || p.epoch !== pend.epoch) return;  // 스캔이 끝났거나 사람이 바뀐 경우 뒤늦은 결과 무시
  if(pend.kind==='clothes'){
    if(masks.clothes)for(let i=0;i<pend.valid.length;i++)if(!pend.valid[i])masks.clothes[i]=0;
    OddAppearance.addClothing(p.clothing,OddAppearance.clothing(masks,pend.rgb,HAIR.segPx,pend.clothMeta));
    p.clothesCount++;return;
  }
  const before=p.hair.n;
  hairAddSample(p.hair, masks, pend.valid, pend.rgb, now, pend.angleW);
  if(p.hair.n>before)p.segCount++;
  if (p.shape) hairCommit(p.hair, hairProfile(p.hair, p.geoMeas));
}

// ── 사람 ──
function createPerson(id, now) {
  return {
    id, epoch: 0, phase: 'scan', bornAt: now, lastSeen: now, alpha: 0, missedFrames: 0, relaxScan: false,
    scan: createShapeScan(), shape: null, geoMeas: null,
    hair: createHairModel(), glasses: createGlassesState(), components: null, manualGlasses:'auto', autoGlasses:null,
    clothing:{samples:[],result:null},clothesCount:0,manualHair:'auto',autoHair:null,manualShirt:null,shirt:null,acceptedPartial:false,
    expr: null, exprTarget:null, rig: null, revealAt: 0, idDrift: 0, lastSeg: -1e9, lastGlasses: -1e9, lastFit: -1e9, segCount: 0,
  };
}

function manualRescan(now) {
  const p = state.person;
  if (!p) return;
  setAdjust(false);
  // 같은 사람의 인식 오류를 바로잡는 용도: 색(id)은 그대로, 형태·헤어·안경은 처음부터
  Object.assign(p, {
    epoch: p.epoch + 1, phase: 'scan', bornAt: now, relaxScan: false, scan: createShapeScan(), shape: null, geoMeas: null,
    hair: createHairModel(), glasses: createGlassesState(), clothing:{samples:[],result:null},clothesCount:0,acceptedPartial:false,components: null, expr: null, exprTarget:null, rig: null, idDrift: 0, lastSeg: -1e9, lastGlasses: -1e9, lastFit: -1e9, lastEvidence: null, segCount: 0,
  });
  // 처리 중인 이전 요청은 완료 시 epoch로 걸러낸다. busy와 pending의 짝은 유지.
}

function loop(now) {
  requestAnimationFrame(loop);
  resizeCanvas();
  checkSegmentHealth(now);
  if (state.phase === 'running' && state.landmarker && video.readyState >= 2 && video.currentTime !== state.lastVideoTime) {
    if(state.landmarker.mode==='worker'){
      if(state.landmarker.request(video,now))state.lastVideoTime=video.currentTime;
    }else if(now-state.lastDetectAt>Math.max(66,state.trackingMs*1.5)){
      state.lastVideoTime=video.currentTime;state.lastDetectAt=now;
      const w=Math.min(640,video.videoWidth),h=Math.round(video.videoHeight*w/video.videoWidth);
      if(trackCanvas.width!==w||trackCanvas.height!==h){trackCanvas.width=w;trackCanvas.height=h;}
      trackCtx.drawImage(video,0,0,w,h);
      const t=performance.now();let res=null;
      try { res = state.landmarker.detectForVideo(trackCanvas, now); } catch (e) { console.error(e); }
      state.trackingMs=performance.now()-t;
      if (res) onLandmarks(res, performance.now());
    }
  }
  render(now);
  if(now-(state.lastUI||0)>100){updateUI(now);state.lastUI=now;}
}
function checkSegmentHealth(now){
  // 얼굴이 돌아가거나 사라져도 요청 타임아웃은 계속 처리한다.
  if(state.phase==='running'&&state.seg.mode==='worker'&&state.seg.busy&&now-state.seg.sentAt>8000)state.seg.fallback('응답 없음');
  if(state.glassesBusy&&now-state.glassesSentAt>3000){state.glassesWorker?.terminate();state.glassesWorker=null;state.glassesBusy=false;}
  if(state.phase==='running'&&state.landmarker?.mode==='worker'&&state.landmarker.busy&&now-state.landmarker.pendingAt>4000){stop();showIntroError('얼굴 분석 응답이 멈췄어요. 카메라 켜기를 눌러 다시 시작해 주세요.');}
}

function onLandmarks(res, now) {
  const lm = res.faceLandmarks && res.faceLandmarks[0];
  if (!lm || lm.length < 468) { if (state.person) state.person.missedFrames++; return; }
  const vw = video.videoWidth, vh = video.videoHeight, P = state.P;
  const count = Math.min(lm.length, 478);
  for (let i = 0; i < count; i++) { P[3 * i] = lm[i].x * vw; P[3 * i + 1] = lm[i].y * vh; P[3 * i + 2] = lm[i].z * vw; }
  const dt = state.lastFrameAt ? Math.min(120, now - state.lastFrameAt) : 16;
  if (state.lastFrameAt) state.fps = lerp(state.fps, 1000 / Math.max(1, now - state.lastFrameAt), 0.05);
  state.lastFrameAt = now;
  const pose = (state.pose = fitPose(P));
  const F = frontalize(P, count, pose, state.F);
  const ref = (state.ref = referenceFace(pose, vw, vh, CONFIG.cameraFovDeg));
  const cats = res.faceBlendshapes && res.faceBlendshapes[0] && res.faceBlendshapes[0].categories;
  state.bs={}; // 이전 프레임의 표정 점수가 빠진 프레임에 남지 않게 한다.
  if (cats) for (const c of cats) state.bs[c.categoryName] = c.score;

  let p = state.person;
  // 얼굴 없는 프레임이 실제로 여러 번 처리됐을 때만 '사람이 떠났다'고 본다 (모델 준비 중 프레임이 느린 것과 구분)
  if (!p || (now - p.lastSeen > CONFIG.newPersonAfterMs && p.missedFrames >= 8)) p = state.person = createPerson(state.personCount++, now);
  p.lastSeen = now; p.missedFrames = 0;
  const frontal = Math.abs(pose.yaw) < HAIR.maxYaw && Math.abs(pose.pitch) < HAIR.maxPitch;
  state.frameConf = frameConfidence(pose, ref, P, vw, vh);

  // 안경 형태·착용 여부는 스캔에서만 결정. 라이브 중 착탈은 재스캔으로 반영.
  const glassesEvery = !p.glasses.worn && p.glasses.ema < 0.15 && now - p.bornAt > 3000 ? CONFIG.glassesEveryMs * 3 : CONFIG.glassesEveryMs;  // 확실히 안 쓴 사람은 드물게
  if (p.phase === 'scan' && state.glassesWorker && !state.glassesBusy && now - p.lastGlasses > glassesEvery && Math.abs(pose.yaw) < 0.35 && Math.abs(pose.pitch) < 0.35 && insideFraction(P, PART_LM.eyes, vw, vh, 2) > 0.95) {
    const gdt = Math.min(500, now - p.lastGlasses);
    p.lastGlasses = now;
    glCtx.setTransform(1, 0, 0, 1, 0, 0);
    glCtx.fillStyle = '#808080'; glCtx.fillRect(0, 0, GL.w, GL.h);  // 화면 밖 부분에 이전 크롭이 남지 않게
    glCtx.setTransform(...headCropTransform(pose, GL.x0, GL.x1, GL.y0, GL.y1, GL.w, GL.h, EYE_MID[2]));
    glCtx.drawImage(video, 0, 0, vw, vh);
    glCtx.setTransform(1, 0, 0, 1, 0, 0);
    const d = glCtx.getImageData(0, 0, GL.w, GL.h).data, gray = new Float32Array(GL.w * GL.h);
    for (let i = 0; i < gray.length; i++) gray[i] = 0.299 * d[4 * i] + 0.587 * d[4 * i + 1] + 0.114 * d[4 * i + 2];
    state.glassesBusy=true;state.glassesSentAt=now;
    state.glassesWorker.postMessage({id:p.id,epoch:p.epoch,gray,F:Float32Array.from(F),glasses:p.glasses,dt:gdt,now},[gray.buffer]);
  }

  if (p.phase === 'scan') {
    p.relaxScan = p.relaxScan || (now - p.bornAt > 3000 && p.scan.samples.length < 3);
    shapeAddSample(p.scan, P, F, pose, ref, state.bs, vw, vh, now, p.relaxScan);
    if (frontal && segReady() && now - p.lastSeg > HAIR.scanMs && (p.segCount<2||p.clothesCount<2||!p.clothing.result?.stable)) requestSegment(p, pose, now);
    const ready=OddAppearance.scanStatus(p,state.seg.mode,now,{minSamples:SCAN.minSamples,minMs:SCAN.minMs});
    if((ready.ready||ready.timedOut)&&now-(p.lastQuality||0)>700){
      p.lastQuality=now;
      // 표본 수만 충분하고 형태 신뢰도가 낮은 경우에도 관객에게 선택을 남긴다.
      const quality=shapeFinalize(p.scan).estimatedShare;
      p.scanQuality=quality;
      if(quality<.6&&ready.ready)finishScan(p,now);
      else if(ready.timedOut){p.acceptedPartial=true;finishScan(p,now);}
    }
    return;
  }

  p.exprTarget = exprTarget(F, p.shape, state.bs, pose);
  if(!p.expr)p.expr=neutralExpr();
  // 헤어 재분할 없음. 표정과 자세만 실시간으로 업데이트한다.
  // 끊김 없이 다른 사람으로 바뀌었는지 (정면·무표정일 때만 비교)
  if (Math.abs(pose.yaw) < 0.2 && Math.abs(pose.pitch) < 0.2 && isNeutral(state.bs) && p.shape.n >= 3) {
    const d = identityDistance(p.shape, F, ref);
    p.idDrift = d > 1 ? p.idDrift + dt : Math.max(0, p.idDrift - dt * 2);
    if (p.idDrift > CONFIG.identityMs) state.person = createPerson(state.personCount++, now);
  }
}

function finishScan(p, now) {
  const occlusion = (part) => {
    if (!p.hair.n) return null;
    const region = PART_REGION[part];
    const face = hairRegionMean(p.hair, region, 'face'), others = hairRegionMean(p.hair, region, 'others');
    if (face == null) return null;
    return smoothstep(0.3, 0.7, face + (part === 'eyes' || part === 'brows' ? 0.8 * (others || 0) : 0));
  };
  p.shape = shapeFinalize(p.scan, occlusion, { exaggeration: CONFIG.exaggeration });
  p.geoMeas = {};
  for (const k in TRAITS) p.geoMeas[k] = TEMPLATE[k] + p.shape.traits[k].eff;
  if (p.hair.n) hairCommit(p.hair, hairProfile(p.hair, p.geoMeas));
  hairDisplayStep(p.hair, Infinity); // 초기 표시를 확정. 라이브 중 형태 보간도 하지 않는다.
  p.glasses.drawShape = p.glasses.worn && p.glasses.shape ? structuredClone(p.glasses.shape) : null;
  p.glasses.alpha = p.glasses.drawShape ? 1 : 0;
  p.components = OddComponents.fromMeasurements({geo:p.shape.geo, base:TEMPLATE, parts:p.shape.parts, hair:p.hair, glasses:p.glasses, asym:p.shape.asym});
  p.autoGlasses={kind:p.components.glasses,lens:p.components.lens,provenance:p.components.provenance.glasses};
  p.autoHair={id:p.components.hair,provenance:p.components.provenance.hair};
  applyGlassesChoice(p);
  applyAppearanceChoice(p);
  p.phase = 'live';
  p.revealAt = now;
}

function personRig(p) {
  const pal = STYLE.palette[p.id % STYLE.palette.length];
  const tone = STYLE.hairTones.find((t) => t.key === p.hair.tone) || STYLE.hairTones[0];
  if (!p.rig) p.rig = { mirror: CONFIG.mirror };
  Object.assign(p.rig, {
    geo: p.shape.geo, geoMeas: p.geoMeas, asym: p.shape.asym, components: p.components,
    colors: { face: pal[0], shirt:p.shirt||'#c7c3bb', hair: tone.color, brow: tone.key === 'black' || tone.key === 'dark' ? STYLE.ink : mix(tone.color, STYLE.ink, 0.5) },
    expr: p.expr, hair: p.hair.display, hairHeadR: p.hair.target ? p.hair.target.headR : null, hairProv: p.hair.target ? p.hair.target.prov : null,
    glasses: { shape: p.glasses.drawShape, alpha: p.glasses.alpha }, debug: state.debug,
  });
  return p.rig;
}

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}

let lastRender = 0;

function render(now) {
  const W = canvas.width, H = canvas.height, dt = Math.min(100, now - (lastRender || now));
  lastRender = now;
  const p = state.person;
  const visible = p && now - p.lastSeen < 300;
  // 다시 스캔(epoch > 0) 중에는 같은 사람이므로 배경색을 그대로 둔다
  const targetBg = hexRGB(visible && (p.phase === 'live' || p.epoch > 0) ? STYLE.palette[p.id % STYLE.palette.length][1] : IDLE_BG);
  for (let i = 0; i < 3; i++) state.bgRGB[i] = lerp(state.bgRGB[i], targetBg[i], 1 - Math.exp(-dt / 220));
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = `rgb(${state.bgRGB.map(Math.round).join(',')})`;
  ctx.fillRect(0, 0, W, H);

  if (p && state.pose && p.phase === 'live') {
    if(p.exprTarget)p.expr=exprUpdate(p.expr,p.exprTarget,dt,visible?state.frameConf:0);
    p.alpha += ((visible ? 1 : 0) - p.alpha) * 0.15;
    const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
    const fx = CONFIG.mirror ? -1 : 1;
    const f = state.follow;
    f.x = lerp(f.x, clamp(state.pose.t[0] / vw, 0, 1), 0.08);
    f.size = lerp(f.size, clamp(Math.pow((state.pose.s * U) / (vh * 0.11), 0.35), 0.86, 1.14), 0.05);
    const cg=OddComponents.geometry(p.components);
    const unit=Math.min(H*.64/(cg.bottom-40),W*.86/(2*cg.w*1.27))*clamp(f.size,.92,1.08);
    const scale=unit*80;
    const x = W / 2 + fx * (f.x - 0.5) * W * 0.3;
    const y=H*.1+(cg.bottom-42-40)*unit;
    if (p.alpha > 0.01) {
      ctx.globalAlpha = p.alpha * smoothstep(0, 450, now-p.revealAt);
      drawBust(ctx, personRig(p), x, y, scale);
      ctx.globalAlpha = 1;
    }
  }
  if(state.compare&&p?.phase==='live'&&video.readyState>=2){
    const pc=cameraPreview.getContext('2d'),cw=cameraPreview.width,ch=cameraPreview.height;
    const sw=Math.min(video.videoWidth,video.videoHeight*cw/ch),sx=(video.videoWidth-sw)/2;
    pc.save();pc.translate(cw,0);pc.scale(-1,1);pc.drawImage(video,sx,0,sw,video.videoHeight,0,0,cw,ch);pc.restore();
  }
  if (state.debug) drawDebug(now);
}

let lastStatus = null;
function updateUI(now) {
  const p=state.person, live=!!(p && p.phase==='live' && now-p.lastSeen<800);
  const preparing=state.phase!=='idle' && !live;
  loadingEl.hidden=!preparing;
  controlsEl.hidden=!live;
  rescanButton.hidden=!live;
  cameraPreview.hidden=!live||!state.compare;
  if(!live)setAdjust(false);
  brandEl.style.color=live?'rgba(41,39,46,.65)':'';
  if (p && glassesChoiceEl.value!==(p.manualGlasses||'auto')) glassesChoiceEl.value=p.manualGlasses||'auto';
  if(p&&hairChoiceEl.value!==(p.manualHair||'auto'))hairChoiceEl.value=p.manualHair||'auto';
  continueButton.hidden=true;
  for(const [id,done]of [['stepFace',p?.scan.samples.length>=SCAN.minSamples],['stepHair',p?.segCount>=2],['stepClothes',p?.clothing.result?.stable]])document.getElementById(id).classList.toggle('done',!!done);
  if (preparing) {
    let title='얼굴을 찾고 있어요',detail='얼굴이 프레임 안에 들어오도록 가까이 와 주세요.',progress=18;
    if (state.phase==='camera') { title='카메라를 연결하고 있어요';detail='카메라 접근을 허용해 주세요.';progress=4; }
    else if (state.phase==='tracker') { title='거울을 준비하고 있어요';detail='처음에는 준비에 조금 더 걸릴 수 있어요.';progress=10; }
    else if (p && now-p.lastSeen<800 && p.phase==='scan') {
      const angled=state.pose && (Math.abs(state.pose.yaw)>.35 || Math.abs(state.pose.pitch)>.35);
      const scan=OddAppearance.scanStatus(p,state.seg.mode,now),ready=segReady();
      title=angled?'정면을 바라봐 주세요':'나만의 얼굴을 만들고 있어요';
      detail=angled?'고개를 조금 돌려 카메라를 봐주세요.':'편한 표정으로 얼굴과 어깨가 보이게 해 주세요.';
      if(!angled&&!scan.face&&!isNeutral(state.bs))detail='입과 눈썹에 힘을 빼고 잠깐만 정면을 봐주세요.';
      if(!angled&&scan.face&&!ready)detail=scan.unavailable?'헤어와 옷을 읽는 도구를 준비하지 못했어요.':'얼굴은 읽었어요. 헤어와 옷을 준비하고 있어요.';
      else if(!angled&&scan.face&&p.segCount<2)detail='윗머리까지 보이도록 조금만 뒤로 가 주세요.';
      else if(!angled&&scan.face&&!p.clothing.result?.stable)detail='어깨와 옷이 보이도록 조금만 뒤로 가 주세요.';
      if(scan.ready&&p.scanQuality>=.6){title='조금 더 또렷하게 볼게요';detail='얼굴에 빛이 고르게 닿도록 정면을 봐주세요.';}
      if(scan.canContinue){continueButton.hidden=false;detail+=' 현재 모습으로 먼저 볼 수도 있어요.';}
      progress=Math.min(97,scan.progress);
    }
    if (loadingTitle.textContent!==title) loadingTitle.textContent=title;
    if (loadingText.textContent!==detail) loadingText.textContent=detail;
    progressFill.style.width=Math.round(progress)+'%';
    progressEl.setAttribute('aria-valuenow',String(Math.round(progress)));
  }
  let text='';
  if (live) {
    const notes=[];
    if (!p.hair.target) notes.push('헤어 미확인');
    else if (p.components.provenance.hair==='partial') notes.push('헤어 일부 추정');
    if(p.components.provenance.hair==='user')notes.push('헤어 직접 보정');
    if (p.components.provenance.glasses==='user') notes.push('안경 직접 보정');
    else if (p.glasses.worn && !p.glasses.shape) notes.push('안경 형태 미확인 · 아래에서 보정할 수 있어요');
    if (p.shape.estimatedShare>=.12) notes.push('일부 특징 추정');
    if(p.acceptedPartial)notes.push('확인하지 못한 외형은 보정할 수 있어요');
    if(p.glasses.samples<6)notes.push('안경 미확인');
    if(p.components.provenance.clothes==='unobserved')notes.push('옷 색 미확인');
    else if(p.components.provenance.clothes==='partial')notes.push('옷 색 확인 부족');
    else if(p.components.provenance.clothes==='user')notes.push('옷 색 직접 보정');
    text=notes.join(' · ');
  }
  if (text!==lastStatus) { statusEl.textContent=text;lastStatus=text; }
  statusEl.hidden=!live || !text;
}

const PART_LABEL = { face: '얼굴형', eyes: '눈', brows: '눈썹', nose: '코', mouth: '입' };
const PROV_LABEL = { observed: '관측', partial: '부분 추정', estimated: '추정' };
const WHY_LABEL = { fit: '맞춤 오차', angle: '고개 각도', clip: '화면 잘림', occlusion: '가림', stability: '흔들림', relation: '부위 관계', extreme: '과도한 값', expression: '표정 섞임' };
const SEG_LABEL = { loading: '받는 중(워커)', worker: '워커', 'main-loading': '받는 중(같은 스레드)', main: '같은 스레드', failed: '불러오기 실패' };

// D 키: 인식 수치 확인 화면
function drawDebug(now) {
  const W = canvas.width, H = canvas.height, dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vw = video.videoWidth, vh = video.videoHeight;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (vw) {
    const tw = 260 * dpr, th = (tw * vh) / vw, ox = W - 16 * dpr - tw, oy = H - 56 * dpr - th;
    ctx.save(); ctx.translate(ox + tw, oy); ctx.scale(-1, 1); ctx.drawImage(video, 0, 0, tw, th);
    ctx.fillStyle = '#43BEA7';
    for (let i = 0; i < 478; i += 3) ctx.fillRect((state.P[3 * i] / vw) * tw - 1, (state.P[3 * i + 1] / vh) * th - 1, 2, 2);
    ctx.restore();
  }
  const p = state.person, f = (v, d = 2) => (typeof v === 'number' ? v.toFixed(d) : v), deg = (r) => Math.round((r * 180) / Math.PI);
  const lines = [`추적 ${Math.round(state.fps)}fps   분할 ${SEG_LABEL[state.seg.mode]}`];
  if (state.pose) lines.push(`고개 좌우 ${deg(state.pose.yaw)}°  위아래 ${deg(state.pose.pitch)}°  기울기 ${deg(state.pose.roll)}°   맞춤 오차 ${f(state.pose.rms, 3)}   프레임 신뢰 ${f(state.frameConf)}`);
  if (p) {
    lines.push(`사람 #${p.id}  ${p.phase === 'scan' ? '읽는 중' : '고정됨'}   표본 ${p.scan.samples.length}   헤어 ${p.segCount}회 · 옷 ${p.clothesCount}회${p.acceptedPartial?' · 부분 결과로 계속':''}`);
    if (p.shape) {
      lines.push('부위 신뢰도: ' + PARTS.map((k) => { const q = p.shape.parts[k]; return `${PART_LABEL[k]} ${f(q.c)} ${PROV_LABEL[q.prov]}${q.why ? `(${WHY_LABEL[q.why]})` : ''}`; }).join('  '));
      lines.push(`부분 추정 ${Math.round(p.shape.estimatedShare * 100)}%   강조: ${p.shape.emphasis.map((k) => PART_LABEL[k]).join(', ') || '없음'}`);
      const t = p.shape.traits;
      lines.push(`차이  얼굴폭 ${f(t.faceW.dev)}  턱폭 ${f(t.jawW.dev)}  턱길이 ${f(t.chinY.dev)}  눈폭 ${f(t.eyeW.dev)}  눈뜸 ${f(t.eyeOpen.dev)}  눈간격 ${f(t.eyeGap.dev)}  코길이 ${f(t.noseY.dev)}  코폭 ${f(t.noseW.dev)}  입폭 ${f(t.mouthW.dev)}  아랫입술 ${f(t.loLip.dev)}`);
      const a = p.shape.asym;
      lines.push(`좌우 차이(일정할 때만)  눈 ${f(a.asymEye)}  눈썹 ${f(a.asymBrow)}  입꼬리 ${f(a.asymMouth)}`);
    }
    if (p.components) lines.push('부품 ' + ['face','eyes','brows','nose','mouth','hair','glasses'].map(k => p.components[k]).join(' / '));
    const h = p.hair, tg = h.target;
    lines.push(`헤어 톤 ${h.tone || '-'}${h.tonePending ? `(→${h.tonePending}?)` : ''}  표본 ${h.n}  겹침 ${h.lastIoU == null ? '-' : f(h.lastIoU)}  반영 ${f(h.lastWeight)}` +
      (tg ? `  윗머리 관측 ${Math.round(tg.upObserved * 100)}%  추정 ${Math.round(tg.estimatedShare * 100)}%  확정 ${h.confirmed ? '있음' : '없음'}  귀 가림 ${tg.earsCovered.map((c) => (c ? 'O' : 'X')).join('/')}` : ''));
    const g = p.glasses, ev = p.lastEvidence;
    lines.push(`안경(실험) ${g.status}  점수 ${f(g.lastScore)} 평균 ${f(g.ema)} (켜짐 ${GL.onScore}/꺼짐 ${GL.offScore})` +
      (ev ? `  아래테 ${f(ev.lower)} 바깥테 ${f(ev.outer)} 연속 ${f(ev.run)} 좌우 ${ev.lr == null ? '-' : f(ev.lr)} 브리지 ${f(ev.bridge, 1)} 액세서리 ${ev.acc == null ? '-' : f(ev.acc)}` : ''));
    if (g.lastFit) lines.push(`  렌즈 형태: ${g.lastFit.ok ? `가로 ${f(g.lastFit.a)} 세로 ${f(g.lastFit.b)} 위 ${f(g.lastFit.nT, 1)} 아래 ${f(g.lastFit.nB, 1)} ${g.lastFit.thick ? '굵은 테' : '얇은 테'}${g.lastFit.topGuessed ? ' (윗테 안 보임: 위 모서리 추정)' : ''}` : `보류 (${g.lastFit.why})`}`);
  } else lines.push('사람을 기다리는 중');
  const fs = 12 * dpr, lh = 18 * dpr, pad = 12 * dpr;
  ctx.font = `${fs}px system-ui, sans-serif`;
  const bw = Math.min(W - 32 * dpr, Math.max(...lines.map((t) => ctx.measureText(t).width)) + pad * 2);
  ctx.fillStyle = 'rgba(20,16,50,0.8)';
  ctx.fillRect(16 * dpr, 16 * dpr, bw, lines.length * lh + pad * 2);
  ctx.fillStyle = '#FFFFFF';
  lines.forEach((t, i) => ctx.fillText(t, 16 * dpr + pad, 16 * dpr + pad + (i + 0.8) * lh, bw - pad * 2));
}
// ==== MAIN END ====
</script>
<script>
  // 얼굴 인식 라이브러리를 못 불러오면 버튼이 계속 꺼져 있으므로 이유를 알려 준다
  setTimeout(function () {
    if (window.__omReady) return;
    var note = document.querySelector('.intro .note');
    note.textContent = '얼굴 인식 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.';
    note.setAttribute('role', 'alert');
  }, 20000);
</script>
</body>
