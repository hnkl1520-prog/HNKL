<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI Generative Art - Density Control</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* UI 패널 - 글래스모피즘 효과 및 하단 중앙 배치 */
        #ui-container {
            position: absolute;
            bottom: 30px; 
            left: 50%;
            transform: translateX(-50%);
            
            /* 글래스모피즘 핵심 속성 */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            
            padding: 20px;
            border-radius: 12px;
            color: #eee;
            z-index: 100;
            width: 260px;
        }
        
        /* 업로드 버튼 디자인 변경 (파란색 포인트) */
        .file-upload {
            display: block;
            width: 100%;
            padding: 12px 0;
            background: #2b50f1; /* 요청하신 베이스 컬러 */
            border: none;
            border-radius: 6px;
            color: #ffffff;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.3s;
            box-sizing: border-box;
        }
        .file-upload:hover { 
            background: #1a3cb5; /* 호버 시 살짝 어두운 파란색 */
        }
        input[type="file"] { display: none; }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 20px;
            pointer-events: none;
            display: none;
            z-index: 200;
        }
        
        /* 하단 안내 텍스트 스타일 */
        .helper-text {
            margin-top: 15px; 
            font-size: 11px; 
            color: #ccc; 
            text-align: center;
        }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    </head>
<body>

    <div id="ui-container">
        <label class="file-upload">
            [ + ] 이미지 업로드
            <input type="file" id="imageInput" accept="image/*">
        </label>
        
        <div class="helper-text">
            * 마우스 왼쪽: 회전 / 휠: 줌
        </div>
    </div>

    <div id="loading">Processing...</div>
    <div id="canvas-container"></div>

    <script>
        // 1. 기본 장면 설정
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(0, 100, 600);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 2. 셰이더 설정
        const vertexShader = `
            uniform float uSize;
            uniform float uTime;
            uniform float uDepth;
            uniform float uNoiseSpeed;
            uniform float uNoiseFreq;
            uniform float uNoiseAmp;
            
            attribute float brightness;
            attribute vec3 color;
            
            varying vec3 vColor;

            void main() {
                vColor = color;
                vec3 pos = position;
                
                pos.z += brightness * uDepth;

                float noise = sin(pos.x * uNoiseFreq + uTime * uNoiseSpeed) + cos(pos.y * uNoiseFreq + uTime * uNoiseSpeed);
                pos.z += noise * uNoiseAmp;

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                gl_PointSize = uSize * (300.0 / -mvPosition.z);
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const fragmentShader = `
            varying vec3 vColor;
            void main() {
                if (length(gl_PointCoord - vec2(0.5, 0.5)) > 0.5) discard;
                gl_FragColor = vec4(vColor, 1.0);
            }
        `;

        // 3. 변수 및 데이터 캐싱
        let particles;
        let cachedImgData = null;
        let cachedWidth = 0;
        let cachedHeight = 0;

        // ★ 이미지 수치에 맞춘 고정 파라미터 값 설정
        const params = {
            particleSize: 4.4,
            particleGap: 4,      
            zDisplacement: 176.0,
            noiseSpeed: 1.5,
            noiseFreq: 0.011,
            noiseAmp: 19.0
        };
        
        const uniforms = {
            uTime: { value: 0 },
            uSize: { value: params.particleSize },
            uDepth: { value: params.zDisplacement },
            uNoiseSpeed: { value: params.noiseSpeed },
            uNoiseFreq: { value: params.noiseFreq },
            uNoiseAmp: { value: params.noiseAmp }
        };

        // 4. 파티클 생성 로직
        function rebuildParticles() {
            if (!cachedImgData) return;

            if (particles) {
                scene.remove(particles);
                particles.geometry.dispose();
                particles.material.dispose();
            }

            const positions = [];
            const colors = [];
            const brightnesses = [];
            const gap = params.particleGap; // 고정된 간격 값 사용

            for (let y = 0; y < cachedHeight; y += gap) {
                for (let x = 0; x < cachedWidth; x += gap) {
                    const i = (y * cachedWidth + x) * 4;
                    const r = cachedImgData[i] / 255;
                    const g = cachedImgData[i + 1] / 255;
                    const b = cachedImgData[i + 2] / 255;
                    const a = cachedImgData[i + 3];

                    if (a > 50) { 
                        positions.push(x - cachedWidth / 2, -(y - cachedHeight / 2), 0);
                        colors.push(r, g, b);
                        const bright = (r + g + b) / 3;
                        brightnesses.push(bright);
                    }
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('brightness', new THREE.Float32BufferAttribute(brightnesses, 1));

            const material = new THREE.ShaderMaterial({
                uniforms: uniforms,
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                transparent: true,
                depthTest: false,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        // 5. 이미지 로드 함수
        function processImage(imageSrc) {
            const img = new Image();
            img.src = imageSrc;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const width = 500; 
                const scale = width / img.width;
                const height = Math.floor(img.height * scale);
                
                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);
                
                const imgData = ctx.getImageData(0, 0, width, height);
                cachedImgData = imgData.data;
                cachedWidth = width;
                cachedHeight = height;

                rebuildParticles();
                
                controls.reset();
                camera.position.set(0, 0, 600);
                document.getElementById('loading').style.display = 'none';
            };
        }

        // 파일 업로드 리스너
        document.getElementById('imageInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('loading').style.display = 'block';
                const reader = new FileReader();
                reader.onload = (event) => processImage(event.target.result);
                reader.readAsDataURL(file);
            }
        });

        // 애니메이션 루프
        function animate() {
            requestAnimationFrame(animate);
            uniforms.uTime.value += 0.01;
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
