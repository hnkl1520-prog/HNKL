<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buddha?</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f5f5f5; /* 아주 옅은 회색 배경 */
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* 뷰파인더 박스 공통 속성 */
        .target-box {
            position: absolute;
            box-sizing: border-box;
            pointer-events: auto; /* 박스 드래그 활성화 */
            cursor: move;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0,0,0,0.02);
            background: transparent;
        }

        /* 박스 1 (검정) */
        #box1 { border: 1px solid rgba(0, 0, 0, 0.15); }
        /* 박스 2 (파랑 - 구분용) */
        #box2 { border: 1px solid rgba(0, 85, 255, 0.15); }

        /* 4개의 포인터 (모서리) */
        .pointer {
            position: absolute;
            width: 24px;
            height: 24px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 박스 1 포인터 */
        #box1 .pointer::after {
            content: '';
            width: 10px;
            height: 10px;
            border: 1px solid #8a8a8a;
            background-color: transparent;
            box-sizing: border-box;
        }

        /* 박스 2 포인터 (파랑) */
        #box2 .pointer::after {
            content: '';
            width: 10px;
            height: 10px;
            border: 1px solid #377aff;
            background-color: transparent;
            box-sizing: border-box;
        }

        .top-left { top: -12px; left: -12px; cursor: nwse-resize; }
        .top-right { top: -12px; right: -12px; cursor: nesw-resize; }
        .bottom-left { bottom: -12px; left: -12px; cursor: nesw-resize; }
        .bottom-right { bottom: -12px; right: -12px; cursor: nwse-resize; }
    </style>
</head>
<body>

    <!-- 박스 1: Dot Matrix -->
    <div id="box1" class="target-box">
        <div class="pointer top-left"></div>
        <div class="pointer top-right"></div>
        <div class="pointer bottom-left"></div>
        <div class="pointer bottom-right"></div>
    </div>

    <!-- 박스 2: Normal Solid -->
    <div id="box2" class="target-box">
        <div class="pointer top-left"></div>
        <div class="pointer top-right"></div>
        <div class="pointer bottom-left"></div>
        <div class="pointer bottom-right"></div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        let sceneSolid, sceneWire, sceneNormal, sceneOverlap, camera, renderer;
        let solidGroup, wireGroup, normalGroup, overlapGroup;
        
        // 2개의 박스 상태.
        // 고정 픽셀로 잡으면 창 크기가 다를 때 모델에서 벗어나므로,
        // 모델의 화면상 가로·세로를 각각 1로 본 비율로 잡고 매번 계산한다.
        const BOX1_REL = { left: -0.281, top: -0.024, width: 0.646, height: 0.693 }; // 좌상 (닷 매트릭스)
        const BOX2_REL = { left:  0.196, top:  0.554, width: 1.168, height: 0.472 }; // 우하 (노멀)

        let bounds1 = { left: 0, top: 0, width: 0, height: 0 };
        let bounds2 = { left: 0, top: 0, width: 0, height: 0 };
        let boundsNeedsUpdate = true;

        // 모델은 가장 긴 축이 5.0 유닛이 되도록 정규화되어 원점에 놓인다.
        // 가로는 로드 직후 실제 값으로 덮어쓴다.
        let modelUnits = { w: 3.278, h: 5.0 };
        let boxesUntouched = true; // 사용자가 한 번이라도 잡으면 자동 배치를 멈춘다

        // 모델이 화면에서 차지하는 사각형 (원점 중심 + 원근 투영으로 계산)
        function modelScreenRect() {
            const visibleH = 2 * camera.position.z * Math.tan((camera.fov * Math.PI / 180) / 2);
            const pxPerUnit = window.innerHeight / visibleH;
            const w = modelUnits.w * pxPerUnit;
            const h = modelUnits.h * pxPerUnit;
            return {
                left: (window.innerWidth  - w) / 2,
                top:  (window.innerHeight - h) / 2,
                width: w, height: h
            };
        }

        function layoutBoxes() {
            const m = modelScreenRect();
            const place = (rel) => ({
                left:   Math.round(m.left + rel.left * m.width),
                top:    Math.round(m.top  + rel.top  * m.height),
                width:  Math.round(rel.width  * m.width),
                height: Math.round(rel.height * m.height)
            });
            Object.assign(bounds1, place(BOX1_REL));
            Object.assign(bounds2, place(BOX2_REL));
            boundsNeedsUpdate = true;
        }

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            // 4개의 Scene 생성
            sceneSolid = new THREE.Scene();
            sceneWire = new THREE.Scene();
            sceneNormal = new THREE.Scene();
            sceneOverlap = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 12;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
            hemiLight.position.set(0, 20, 0);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7);
            
            sceneSolid.add(ambientLight);
            sceneSolid.add(hemiLight);
            sceneSolid.add(dirLight);

            solidGroup = new THREE.Group();
            wireGroup = new THREE.Group();
            normalGroup = new THREE.Group();
            overlapGroup = new THREE.Group();
            
            sceneSolid.add(solidGroup);
            sceneWire.add(wireGroup); 
            sceneNormal.add(normalGroup);
            sceneOverlap.add(overlapGroup);

            // 모델 로드
            const loader = new THREE.GLTFLoader();
            const modelUrl = './media/buddha_2.glb';

            loader.load(modelUrl, function(gltf) {
                const modelSolid = gltf.scene;

                // 스케일 및 중앙 정렬
                const box = new THREE.Box3().setFromObject(modelSolid);
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 5.0 / maxDim;
                modelSolid.scale.set(scale, scale, scale);

                modelSolid.updateMatrixWorld(true);
                const scaledBox = new THREE.Box3().setFromObject(modelSolid);
                const center = scaledBox.getCenter(new THREE.Vector3());
                modelSolid.position.sub(center);

                // 실제 치수를 알았으니 박스를 모델에 맞춰 다시 잡는다
                const scaledSize = scaledBox.getSize(new THREE.Vector3());
                modelUnits = { w: scaledSize.x, h: scaledSize.y };
                if (boxesUntouched) layoutBoxes();

                // 0. 원본 (배경 화면)
                solidGroup.add(modelSolid);

                // ==========================================
                // 박스 1: 닷 매트릭스 (흰색 가림막 + 은은한 선 + 검은 점)
                // ==========================================
                const modelWire = modelSolid.clone();
                modelWire.traverse(function(child) {
                    if (child.isMesh) {
                        child.material = new THREE.MeshBasicMaterial({ 
                            color: 0xffffff, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1
                        });
                        const wireGeo = new THREE.WireframeGeometry(child.geometry);
                        child.add(new THREE.LineSegments(wireGeo, new THREE.LineBasicMaterial({
                            color: 0xbbbbbb, transparent: true, opacity: 0.3
                        })));
                        child.add(new THREE.Points(child.geometry, new THREE.PointsMaterial({ 
                            color: 0x333333, size: 0.035, sizeAttenuation: true
                        })));
                    }
                });
                wireGroup.add(modelWire);

                // ==========================================
                // 박스 2: 무지개빛 법선 뷰 (Normal Solid)
                // ==========================================
                const modelNormal = modelSolid.clone();
                modelNormal.traverse(function(child) {
                    if (child.isMesh) {
                        child.material = new THREE.MeshNormalMaterial();
                    }
                });
                normalGroup.add(modelNormal);

                // ==========================================
                // 교집합: 점은 지우고, 원본 메쉬 자체를 무지개 선으로 변경
                // ==========================================
                const modelOverlap = modelSolid.clone();
                modelOverlap.traverse(function(child) {
                    if (child.isMesh) {
                        // 💡 렌더링 누락 버그 해결: 
                        // visible:false 꼼수 대신, 메쉬 자체의 재질을 무지개 와이어프레임으로 완전히 교체합니다.
                        child.material = new THREE.MeshNormalMaterial({
                            wireframe: true,
                            transparent: true,
                            opacity: 0.15, // 💡 투명도를 0.8에서 0.15로 대폭 낮춰 시각적으로 아주 얇고 미세하게 보이게 함
                            blending: THREE.AdditiveBlending, // 💡 가산 혼합을 추가하여 거미줄처럼 얇은 선들이 겹칠 때 빛을 발하도록 설정
                            depthWrite: false // 얇은 선들이 서로 파먹지 않고 자연스럽게 겹치도록 설정
                        });
                    }
                });
                overlapGroup.add(modelOverlap);

            });

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); 
            renderer.autoClear = false;
            container.appendChild(renderer.domElement);

            layoutBoxes();
            updateBoxDOM();
            
            // 드래그 로직
            setupDraggable('box1', bounds1);
            setupDraggable('box2', bounds2);

            window.addEventListener('resize', onWindowResize, false);
        }

        function updateBoxDOM() {
            const b1El = document.getElementById('box1');
            b1El.style.left = `${bounds1.left}px`;
            b1El.style.top = `${bounds1.top}px`;
            b1El.style.width = `${bounds1.width}px`;
            b1El.style.height = `${bounds1.height}px`;

            const b2El = document.getElementById('box2');
            b2El.style.left = `${bounds2.left}px`;
            b2El.style.top = `${bounds2.top}px`;
            b2El.style.width = `${bounds2.width}px`;
            b2El.style.height = `${bounds2.height}px`;
            
            boundsNeedsUpdate = false;
        }

        function setupDraggable(boxId, boundsObj) {
            const boxEl = document.getElementById(boxId);
            const pointers = {
                'top-left': boxEl.querySelector('.top-left'),
                'top-right': boxEl.querySelector('.top-right'),
                'bottom-left': boxEl.querySelector('.bottom-left'),
                'bottom-right': boxEl.querySelector('.bottom-right'),
                'box': boxEl
            };

            let activeHandle = null;
            let startX, startY, startRect;

            const onStart = (e, handle) => {
                if (handle === 'box' && e.target !== boxEl) return;
                e.preventDefault();
                activeHandle = handle;
                boxesUntouched = false;
                
                document.getElementById('box1').style.zIndex = boxId === 'box1' ? 20 : 10;
                document.getElementById('box2').style.zIndex = boxId === 'box2' ? 20 : 10;

                const isTouch = e.type.startsWith('touch');
                startX = isTouch ? e.touches[0].clientX : e.clientX;
                startY = isTouch ? e.touches[0].clientY : e.clientY;
                
                startRect = {
                    left: boundsObj.left, top: boundsObj.top,
                    right: boundsObj.left + boundsObj.width, bottom: boundsObj.top + boundsObj.height
                };
            };

            for (const [key, el] of Object.entries(pointers)) {
                el.addEventListener('mousedown', (e) => onStart(e, key));
                el.addEventListener('touchstart', (e) => onStart(e, key), { passive: false });
            }

            const onMove = (e) => {
                if (!activeHandle) return;
                e.preventDefault();
                
                const isTouch = e.type.startsWith('touch');
                const clientX = isTouch ? e.touches[0].clientX : e.clientX;
                const clientY = isTouch ? e.touches[0].clientY : e.clientY;
                const dx = clientX - startX;
                const dy = clientY - startY;

                let newBounds = { ...startRect };
                const minSize = 50; 

                if (activeHandle === 'top-left') { newBounds.left += dx; newBounds.top += dy; } 
                else if (activeHandle === 'top-right') { newBounds.right += dx; newBounds.top += dy; } 
                else if (activeHandle === 'bottom-left') { newBounds.left += dx; newBounds.bottom += dy; } 
                else if (activeHandle === 'bottom-right') { newBounds.right += dx; newBounds.bottom += dy; } 
                else if (activeHandle === 'box') {
                    newBounds.left += dx; newBounds.right += dx;
                    newBounds.top += dy; newBounds.bottom += dy;
                }

                if (newBounds.right - newBounds.left < minSize) {
                    if (activeHandle.includes('left')) newBounds.left = newBounds.right - minSize;
                    else newBounds.right = newBounds.left + minSize;
                }
                if (newBounds.bottom - newBounds.top < minSize) {
                    if (activeHandle.includes('top')) newBounds.top = newBounds.bottom - minSize;
                    else newBounds.bottom = newBounds.top + minSize;
                }

                boundsObj.left = newBounds.left;
                boundsObj.top = newBounds.top;
                boundsObj.width = newBounds.right - newBounds.left;
                boundsObj.height = newBounds.bottom - newBounds.top;
                boundsNeedsUpdate = true;
            };

            const onEnd = () => { activeHandle = null; };

            window.addEventListener('mousemove', onMove);
            window.addEventListener('touchmove', onMove, { passive: false });
            window.addEventListener('mouseup', onEnd);
            window.addEventListener('touchend', onEnd);
        }

        function getIntersection(b1, b2) {
            const left = Math.max(b1.left, b2.left);
            const top = Math.max(b1.top, b2.top);
            const right = Math.min(b1.left + b1.width, b2.left + b2.width);
            const bottom = Math.min(b1.top + b1.height, b2.top + b2.height);

            if (left < right && top < bottom) {
                return { left, top, width: right - left, height: bottom - top };
            }
            return null; 
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (boxesUntouched) layoutBoxes();
        }

        function animate() {
            requestAnimationFrame(animate);

            if (boundsNeedsUpdate) updateBoxDOM();

            // Y축 회전 동기화
            const rotationSpeed = 0.002; 
            solidGroup.rotation.y += rotationSpeed;
            wireGroup.rotation.y = solidGroup.rotation.y;
            normalGroup.rotation.y = solidGroup.rotation.y;
            overlapGroup.rotation.y = solidGroup.rotation.y;

            // =========================
            // 렌더링 파이프라인
            // =========================
            
            // 0. 베이스 화면 (솔리드)
            renderer.setScissorTest(false);
            renderer.setClearColor(0xf5f5f5, 1);
            renderer.clear();
            renderer.render(sceneSolid, camera);

            renderer.setScissorTest(true);
            const winH = window.innerHeight;

            // 1. 박스 1 (흰색 배경)
            renderer.setScissor(bounds1.left, winH - (bounds1.top + bounds1.height), bounds1.width, bounds1.height);
            renderer.setClearColor(0xffffff, 1);
            renderer.clear();
            renderer.render(sceneWire, camera);

            // 2. 박스 2 (어두운 회색 배경)
            renderer.setScissor(bounds2.left, winH - (bounds2.top + bounds2.height), bounds2.width, bounds2.height);
            renderer.setClearColor(0x222222, 1);
            renderer.clear();
            renderer.render(sceneNormal, camera);

            // 3. 교집합 (딥 블랙 배경 + 무지개 선)
            const intersect = getIntersection(bounds1, bounds2);
            if (intersect) {
                renderer.setScissor(intersect.left, winH - (intersect.top + intersect.height), intersect.width, intersect.height);
                
                // 💡 선명한 대비를 위해 교집합 배경을 순수한 블랙(Pure Black)으로 변경
                renderer.setClearColor(0x000000, 1); 
                renderer.clear();
                renderer.render(sceneOverlap, camera);
            }
        }
    </script>
</body>
</html>
