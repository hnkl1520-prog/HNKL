<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Works</title>
    
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    
    <!-- [연결] 디자인 토큰 → 공통 스타일 (tokens.css 가 먼저) -->
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="common.css">
    
    <!-- GSAP (필수 애니메이션 라이브러리) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- [추가] 프리로더 & 썸네일 비율 스타일 -->
    <style>
        /* [수정] 프리로더 전체 컨테이너 - 검정 배경 */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000; /* 검정 배경 */
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 로더 래퍼 */
        .loader-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SVG 원형 그래프 */
        .progress-ring {
            transform: rotate(-90deg); /* 12시 방향부터 시작하도록 회전 */
            transform-origin: 50% 50%;
        }

        .progress-ring__circle-bg {
            stroke: #333333; /* 어두운 회색 트랙 */
        }

        .progress-ring__circle {
            stroke: url(#loader-gradient); /* 그라데이션 적용 */
            transition: stroke-dashoffset 0.1s linear;
        }

        /* 가운데 숫자 텍스트 - 흰색 */
        .loader-text {
            position: absolute;
            font-family: 'Pretendard', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: #ffffff; /* 흰색 텍스트 */
            text-align: center;
        }
        
        /* [수정] 16:9 비율 설정을 위한 CSS 오버라이드 */
        /* .mode-projects 클래스가 붙었을 때만 16:9 적용 */
        .works-grid.mode-projects .thumb-wrapper {
            aspect-ratio: 16 / 9 !important;
            height: auto !important; /* 높이값 초기화하여 비율 따르도록 */
        }
        
        /* [추가] Labs 모드일 때 썸네일 박스에 옅은 아웃라인 추가 */
        .works-grid.mode-labs .thumb-wrapper {
            border: 1px solid rgba(255, 255, 255, 0.15); /* 투명도 15%의 옅은 흰색 테두리 */
            box-sizing: border-box;
        }
        
        .thumb-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- [수정] 원형 프리로더 (검정 배경 + 키 컬러 그라데이션) -->
    <div id="preloader">
        <div class="loader-wrapper">
            <!-- SVG Circle -->
            <svg class="progress-ring" width="120" height="120">
                <defs>
                    <linearGradient id="loader-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#2997ff" />
                        <stop offset="100%" stop-color="#9c6dff" />
                    </linearGradient>
                </defs>
                <!-- 배경 원 (어두운 회색) -->
                <circle 
                    class="progress-ring__circle-bg"
                    stroke-width="4"
                    fill="transparent"
                    r="52"
                    cx="60"
                    cy="60"
                />
                <!-- 진행 원 (그라데이션) -->
                <circle 
                    class="progress-ring__circle"
                    stroke-width="4"
                    fill="transparent"
                    r="52"
                    cx="60"
                    cy="60"
                />
            </svg>
            <!-- 가운데 숫자 -->
            <div class="loader-text" id="loader-percent">0%</div>
        </div>
    </div>

    <!-- 헤더 (ID: global-header 필수) -->
    <header id="global-header" class="at-top">
        <div class="header-inner">
            <div class="header-left">
                <!-- 로고는 메인(또는 about)으로 이동 -->
                <a href="about.html" class="header-logo hover-trigger">
                    <img src="assets/logo.svg" alt="HANUK Logo">
                </a>
                <nav class="header-nav">
                    <a href="about.html" class="nav-link hover-trigger">About</a>
                    <a href="#" class="nav-link active hover-trigger">Works</a>
                </nav>
            </div>
            <div class="header-right">
                <button class="lang-btn active hover-trigger">KR</button>
                <span class="lang-divider">/</span>
                <button class="lang-btn hover-trigger">EN</button>
            </div>
        </div>
    </header>

    <!-- 커스텀 젤리 커서 -->
    <div id="cursor-bg-layer">
        <div id="cursor-circle"></div>
    </div>
    <div id="cursor-text-layer">
        <span id="cursor-text"></span>
    </div>

    <!-- 메인 컨텐츠 -->
    <main>
        <div class="container">
            <!-- 갤러리 그리드 -->
            <div id="works-grid" class="works-grid"></div>
        </div>
    </main>

    <!-- Floating Dock -->
    <nav class="floating-dock">
        <!-- 움직이는 배경 (쫀득이) -->
        <div class="dock-pill" id="dock-pill"></div>
        
        <button onclick="switchCategory('projects', this)" class="dock-btn active hover-trigger" id="btn-projects">
            <img src="assets/Projects.svg" class="dock-icon" alt="Projects Icon">
            <span>Projects</span>
        </button>
        
        <button onclick="switchCategory('labs', this)" class="dock-btn hover-trigger" id="btn-labs">
            <img src="assets/Labs.svg" class="dock-icon" alt="Labs Icon">
            <span>Labs</span>
        </button>
    </nav>

    <!-- [연결] 공통 스크립트 -->
    <script src="common.js"></script>

    <!-- 페이지 전용 스크립트 -->
    <script>
        // ===============================================
        // DATA
        // ===============================================
        // 경로 규칙: img·url 모두 public 루트 기준 전체 경로 (프로젝트별 폴더 구조)
        // active: false 는 목록에 나오지 않음 (데이터는 그대로 두고 다시 켜기만 하면 됨)
        const projectsData = [
            { active: true,  title: "VIBRA: XR FOOTBALL BROADCASTING SERIVCE", cat: "XR, UX, INTERACTION", img: "works/projects/vibra/thumb.png", url: "works/projects/vibra/vibra.html" },
            { active: true,  title: "KORAIL EDUCATION APP", cat: "UX, UI, AR, 3D", img: "works/projects/korail/thumb.png", url: "404.html" },
            { active: false, title: "REST MODE", cat: "Mobility, UX, UI", img: "works/projects/restmode/thumb.png", url: "works/projects/restmode/restmode.html" },
            { active: false, title: "SWIG : a Smart Golf Cart", cat: "Mobility, UX, UI", img: "works/projects/swig/thumb.png", url: "404.html" },
            { active: false, title: "VA PLAY", cat: "AR, Mobile Service", img: "works/projects/vaplay/thumb.png", url: "404.html" },
            { active: false, title: "CAP:US ", cat: "App Design", img: "works/projects/capus/thumb.png", url: "404.html" }
        ];

        const labsData = [
            { title: "Buddha?", cat: "Creative Coding", img: "works/labs/buddha_2/thumb.png", url: "works/labs/buddha_2/buddha_2.html" },
            { title: "Budda in the Window", cat: "Creative Coding", img: "works/labs/budda/thumb.png", url: "works/labs/budda/budda.html" },
            { title: "Goldfish", cat: "Creative Coding", img: "works/labs/goldfish/thumb.jpg", url: "works/labs/goldfish/goldfish.html" },
            { title: "Dots", cat: "Creative Coding", img: "works/labs/dots/thumb.jpg", url: "works/labs/dots/dots.html" },
            { title: "Blur", cat: "Creative Coding", img: "works/labs/blur/thumb.png", url: "works/labs/blur/blur.html" },
            { title: "Untitled_01", cat: "Creative Coding", img: "works/labs/untitled-01/thumb.png", url: "works/labs/untitled-01/untitled-01.html" },
            { title: "Untitled_02", cat: "Creative Coding", img: "works/labs/untitled-02/thumb.png", url: "works/labs/untitled-02/untitled-02.html" }
        ];

        let currentCategory = 'projects';

        // ===============================================
        // INITIALIZATION
        // ===============================================
        window.addEventListener('load', () => {
            initPreloader(() => {
                // 로딩이 끝난 후 실행될 콜백
                renderWorks('projects');
                
                // 독(Dock) 초기 위치 설정
                const initialBtn = document.getElementById('btn-projects');
                if(initialBtn) movePill(initialBtn, true); 
            });
        });

        // [수정] 원형 프리로더 로직 (About 페이지와 동일한 Slide Up 효과 적용)
        function initPreloader(onCompleteCallback) {
            // 스크롤 잠금
            document.body.style.overflow = 'hidden';

            const circle = document.querySelector('.progress-ring__circle');
            const radius = circle.r.baseVal.value;
            const circumference = radius * 2 * Math.PI; 
            
            const textElement = document.getElementById('loader-percent');
            const preloader = document.getElementById('preloader');

            circle.style.strokeDasharray = `${circumference} ${circumference}`;
            circle.style.strokeDashoffset = circumference;

            const loading = { value: 0 };

            gsap.to(loading, {
                value: 100,
                duration: 2.0, // About 페이지와 동일하게 2초
                ease: "power2.inOut",
                onUpdate: () => {
                    const progress = Math.round(loading.value);
                    textElement.innerText = `${progress}%`;
                    const offset = circumference - (progress / 100) * circumference;
                    circle.style.strokeDashoffset = offset;
                },
                onComplete: () => {
                    // 1. 로더 내부 요소(원, 텍스트)만 먼저 투명하게
                    gsap.to('.loader-wrapper', { opacity: 0, duration: 0.5 });

                    // 2. 검정 배경 자체가 위로 부드럽게 올라가며(Curtain Slide) 사이트 공개
                    gsap.to(preloader, {
                        top: "-100%", 
                        duration: 1.2, 
                        ease: "power3.inOut",
                        delay: 0.1, // 원이 사라지기 시작한 직후 슬라이드 시작
                        onComplete: () => {
                            preloader.style.display = 'none';
                            document.body.style.overflow = ''; // 스크롤 잠금 해제
                            if(onCompleteCallback) onCompleteCallback();
                        }
                    });
                }
            });
        }

        // ===============================================
        // GALLERY LOGIC
        // ===============================================

        function renderWorks(category) {
            const grid = document.getElementById('works-grid');
            const data = (category === 'projects' ? projectsData : labsData)
                .filter(item => item.active !== false);
            
            // [수정] 16:9 비율 제어를 위한 클래스 토글
            if (category === 'projects') {
                grid.classList.add('mode-projects');
                grid.classList.remove('mode-labs');
            } else {
                grid.classList.add('mode-labs');
                grid.classList.remove('mode-projects');
            }

            grid.innerHTML = '';

            data.forEach((item, index) => {
                const imgSrc = item.img;   // 데이터에 전체 경로가 들어있음
                const linkUrl = item.url ? item.url : '404.html';
                
                const html = `
                    <article class="work-item hover-trigger" onclick="location.href='${linkUrl}'">
                        <div class="thumb-wrapper">
                            <img src="${imgSrc}" class="thumb-img" alt="${item.title}" onerror="this.src='https://via.placeholder.com/600x600/e0e0e0/888?text=No+Image'">
                            <div class="reveal-curtain"></div>
                        </div>
                        <div class="work-meta">
                            <div class="work-cat">${item.cat}</div>
                            <h3 class="work-title">${item.title}</h3>
                        </div>
                    </article>
                `;
                grid.insertAdjacentHTML('beforeend', html);
            });

            animateItems();
        }

        function animateItems() {
            const items = document.querySelectorAll('.work-item');
            const directions = ['top', 'bottom', 'left', 'right'];

            items.forEach((item, i) => {
                gsap.fromTo(item, 
                    { opacity: 0, y: 30 },
                    { opacity: 1, y: 0, duration: 0.6, ease: "power2.out", delay: i * 0.05 }
                );

                const curtain = item.querySelector('.reveal-curtain');
                const dir = directions[Math.floor(Math.random() * 4)];
                
                curtain.style.top = '0'; curtain.style.left = '0'; 
                curtain.style.right = 'auto'; curtain.style.bottom = 'auto';
                curtain.style.width = '100%'; curtain.style.height = '100%';

                let targetProps = {};

                switch(dir) {
                    case 'top':    targetProps = { height: "0%" }; break;
                    case 'bottom': curtain.style.top = 'auto'; curtain.style.bottom = '0'; targetProps = { height: "0%" }; break;
                    case 'left':   targetProps = { width: "0%" }; break;
                    case 'right':  curtain.style.left = 'auto'; curtain.style.right = '0'; targetProps = { width: "0%" }; break;
                }

                gsap.to(curtain, {
                    ...targetProps,
                    duration: 0.8,
                    ease: "power3.inOut",
                    delay: 0.1 + (i * 0.05)
                });
            });
        }

        function switchCategory(category, clickedBtn) {
            if (currentCategory === category) return;
            currentCategory = category;

            document.querySelectorAll('.dock-btn').forEach(btn => btn.classList.remove('active'));
            clickedBtn.classList.add('active');
            movePill(clickedBtn);

            if (category === 'labs') {
                document.documentElement.classList.add('dark-mode');
            } else {
                document.documentElement.classList.remove('dark-mode');
            }

            const oldItems = document.querySelectorAll('.work-item');
            gsap.to(oldItems, {
                opacity: 0, y: -20, duration: 0.3, stagger: 0.02,
                onComplete: () => {
                    renderWorks(category);
                }
            });
        }

        function movePill(targetBtn, immediate = false) {
            const pill = document.getElementById('dock-pill');
            if(!pill) return;
            
            const x = targetBtn.offsetLeft;
            const w = targetBtn.offsetWidth;
            
            if (immediate) {
                gsap.set(pill, { left: x, width: w });
            } else {
                gsap.to(pill, {
                    left: x,
                    width: w,
                    duration: 1.0, 
                    ease: "elastic.out(1, 0.4)" 
                });
            }
        }
    </script>
</body>
</html>
