<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f1f1ef">
  <meta name="robots" content="noindex">
  <title>Under construction — HNKL</title>
  <script>
    (() => {
      const mobile = matchMedia('(max-width: 767px), (pointer: coarse)');
      const showMobileVersion = () => {
        if (mobile.matches) location.replace(new URL('../page-states/soon-editor/', location.href));
      };
      mobile.addEventListener('change', showMobileVersion);
      showMobileVersion();
    })();
  </script>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="../page-states/soon-editor/style.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="page-header"><a class="brand" href="/index.html" aria-label="HNKL 홈">HNKL</a></header>
  <main class="editor" aria-labelledby="page-title">
    <svg id="worker-canvas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="group" aria-label="네 모서리를 움직여 자세를 바꾸는 작업자">
      <defs><clipPath id="frame-clip"><rect id="clip-rect"/></clipPath></defs>
      <g id="artwork" clip-path="url(#frame-clip)" aria-hidden="true"></g>
      <rect id="frame" aria-hidden="true"/>
      <g id="corners"></g>
    </svg>
    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
  </main>
  <footer class="caption">
    <h1 id="page-title">UNDER CONSTRUCTION</h1>
    <a class="back-btn" href="/index.html" data-hover-text="Go Back"><span>Go Back</span></a>
  </footer>
  <noscript><img class="worker-fallback" src="worker.svg" alt="상자 높이에 맞춰 서거나 무릎을 세우고 앉는 작업자"></noscript>
</body>
</html>
