<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HNKL · Character study</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>*{box-sizing:border-box}body{margin:0;background:#f2f1ed;color:#24313a;font-family:Pretendard,system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:50px 64px}header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:32px;border-bottom:1px solid #d5d5cc}h1{font-size:30px;letter-spacing:-1px;font-weight:600;margin:0 0 10px}header p{margin:0;color:#6b7376;font-size:15px;line-height:1.6}.tag{font-size:12px;letter-spacing:.14em;margin-top:8px}#poses{display:grid;grid-template-columns:1fr 1fr;gap:42px 56px;margin-top:32px}article{min-width:0}h2{font-size:18px;font-weight:500;margin:0 0 8px}article p{font-size:14px;color:#6b7376;line-height:1.5;margin:0}.drawing{height:385px;display:flex;align-items:center;justify-content:center;margin:12px 0 0}svg{height:100%;width:100%}footer{border-top:1px solid #d5d5cc;margin-top:30px;padding-top:20px;display:flex;gap:28px;font-size:13px;color:#6b7376}.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px} @media(max-width:700px){main{padding:28px}#poses{grid-template-columns:1fr}}
</style><main><header><div><h1>작업자 캐릭터 · 자세 시안</h1><p>눈 없는 옆모습, 반팔과 장갑, 단색 작업복.</p></div><span class="tag">HNKL / CHARACTER STUDY</span></header><div id="poses"></div><footer><span><i class="swatch" style="background:#ef9143"></i>안전 조끼</span><span><i class="swatch" style="background:#446ba9"></i>바지 · 장갑</span><span><i class="swatch" style="background:#f0c657"></i>안전모 · 작업화</span></footer></main>
<script type="module">
import{createPose}from'./pose.js';import{createCharacter}from'./character.js';
const states=[{w:205,h:340,title:'01 · 서 있기',desc:'높이가 충분할 때는 두 발을 바닥에 두고 서 있습니다.'},{w:220,h:265,title:'02 · 천장 짚기',desc:'상자가 낮아지면 무릎을 굽히고 손으로 천장을 받칩니다.'},{w:205,h:185,title:'03 · 웅크려 앉기',desc:'등과 엉덩이를 벽에 붙이고 무릎을 가슴 쪽으로 접습니다.'},{w:360,h:185,title:'04 · 낮게 기대기',desc:'상자가 넓고 낮아지면 몸을 기울여 다리를 접습니다.'}];
for(const s of states){const a=document.createElement('article');a.innerHTML='<h2>'+s.title+'</h2><p>'+s.desc+'</p><div class="drawing"></div>';document.querySelector('#poses').append(a);const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','-20 -20 410 375');const g=document.createElementNS(ns,'g');g.setAttribute('transform','translate('+((370-s.w)/2)+' '+((335-s.h)/2)+')');svg.append(g);const r=document.createElementNS(ns,'rect');for(const[k,v]of Object.entries({width:s.w,height:s.h,fill:'none',stroke:'#3B7EFA','stroke-width':.9,'stroke-dasharray':'4 4'}))r.setAttribute(k,v);g.append(r);createCharacter(g).render(createPose(s.w,s.h));for(const[x,y]of[[0,0],[s.w,0],[s.w,s.h],[0,s.h]]){const n=document.createElementNS(ns,'rect');for(const[k,v]of Object.entries({x:x-3,y:y-3,width:6,height:6,fill:'#f2f1ed',stroke:'#3b7efa','stroke-width':1}))n.setAttribute(k,v);g.append(n)}a.querySelector('.drawing').append(svg)}document.body.dataset.ready='true';
</script></html>
