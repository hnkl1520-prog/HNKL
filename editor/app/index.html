<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>HNKL Editor</title>
    <!-- 앱으로 설치하면 독에 자체 아이콘이 생기고, 브라우저 창이 아닌 것처럼 열린다.
         (Chrome 주소창 오른쪽 설치 아이콘 → '설치') -->
    <link rel="manifest" href="/__app/manifest.webmanifest">
    <link rel="icon" href="/__app/icons/app/icon-192.png">
    <meta name="theme-color" content="#F1F1F3">
<link rel="stylesheet" href="/__app/app.css">
</head>
<body>

<header class="bar">
    <!-- 좌: 컨텍스트 — 지금 어디에서, 무엇을 하고 있는가 (브랜드 · 경로 · 작업 모드) -->
    <div class="bar-zone bar-left">
        <img class="brand" src="/preview/assets/logo.svg" alt="HNKL" width="52" height="21">
        <span class="sep"></span>
        <!-- 현재 위치를 경로로 보여준다. 파일명을 누르면 목록에서 고를 수 있다. -->
        <nav class="crumb" id="crumb" aria-label="Current file path">
            <button class="crumb__file" id="crumbFile" type="button" title="Open another file">
                <span id="crumbPath"></span>
                <span class="crumb__dot" id="crumbDot" hidden title="Unsaved changes">●</span>
            </button>
            <select id="pageSelect" class="crumb__select" title="Page to edit" aria-label="Page to edit"></select>
        </nav>
        <span class="sep"></span>
        <div class="mode-switch" role="tablist" aria-label="Mode">
            <button id="editTab" class="mode-btn on" role="tab">Edit</button>
            <button id="dsTab"   class="mode-btn"    role="tab">Design System</button>
        </div>
    </div>

    <!-- 중앙: 뷰포트(브레이크포인트) 제어 + 활성 해상도 -->

        <div class="bp" id="breakpoints" role="group" aria-label="Screen size">

            <button data-w="1536" data-h="864" class="on" title="Laptop 1536×864" aria-label="Laptop"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M1.38477 20.2305V18.7305H22.6153V20.2305H1.38477ZM4.30777 17.7305C3.8026 17.7305 3.37502 17.5555 3.02502 17.2055C2.67502 16.8555 2.50002 16.4279 2.50002 15.9227V5.53822C2.50002 5.03305 2.67502 4.60547 3.02502 4.25547C3.37502 3.90547 3.8026 3.73047 4.30777 3.73047H19.6923C20.1974 3.73047 20.625 3.90547 20.975 4.25547C21.325 4.60547 21.5 5.03305 21.5 5.53822V15.9227C21.5 16.4279 21.325 16.8555 20.975 17.2055C20.625 17.5555 20.1974 17.7305 19.6923 17.7305H4.30777ZM4.30777 16.2305H19.6923C19.7693 16.2305 19.8398 16.1985 19.9038 16.1345C19.9679 16.0703 20 15.9997 20 15.9227V5.53822C20 5.46122 19.9679 5.39072 19.9038 5.32672C19.8398 5.26255 19.7693 5.23047 19.6923 5.23047H4.30777C4.23077 5.23047 4.16027 5.26255 4.09627 5.32672C4.0321 5.39072 4.00002 5.46122 4.00002 5.53822V15.9227C4.00002 15.9997 4.0321 16.0703 4.09627 16.1345C4.16027 16.1985 4.23077 16.2305 4.30777 16.2305Z"/></svg></button>

        </div>
        <span class="bp-res" id="bpRes" title="Rendering at">1536 × 864</span>
    </div>

    <!-- 우: 액션 — 이 페이지에 무엇을 할 것인가 (열어보기 · 되돌리기 · 저장).
         디자인 시스템 모드에선 통째로 숨는다. 모드 스위처는 좌측에 있어 돌아올 수 있다. -->
    <div class="bar-zone bar-right">
        <div class="bar-actions" id="barActions">
            <!-- 지금 보는 페이지를 편집 도구 없이 실제 브라우저에서 연다 -->
            <button id="openRawBtn" class="ct-tool ct-tool--bar" type="button" title="Open in browser — the real page, no editing tools">
                <!-- open_in_new -->
                <svg class="ico" viewBox="0 -960 960 960" aria-hidden="true"><path d="M212.31-140Q182-140 161-161q-21-21-21-51.31v-535.38Q140-778 161-799q21-21 51.31-21h252.3v60h-252.3q-4.62 0-8.46 3.85-3.85 3.84-3.85 8.46v535.38q0 4.62 3.85 8.46 3.84 3.85 8.46 3.85h535.38q4.62 0 8.46-3.85 3.85-3.84 3.85-8.46v-252.3h60v252.3Q820-182 799-161q-21 21-51.31 21H212.31Zm176.46-206.62-42.15-42.15L717.85-760H560v-60h260v260h-60v-157.85L388.77-346.62Z"/></svg>
            </button>

            <span class="sep"></span>
            <span id="dirty" class="dirty" hidden>Changed <b id="dirtyCount">0</b></span>

            <span class="sep"></span>
            <button id="saveBtn" class="btn primary" disabled title="Save" aria-label="Save"><svg class="ico" viewBox="0 -960 960 960" aria-hidden="true"><path d="M820-671.54v459.23Q820-182 799-161q-21 21-51.31 21H212.31Q182-140 161-161q-21-21-21-51.31v-535.38Q140-778 161-799q21-21 51.31-21h459.23L820-671.54ZM760-646 646-760H212.31q-5.39 0-8.85 3.46t-3.46 8.85v535.38q0 5.39 3.46 8.85t8.85 3.46h535.38q5.39 0 8.85-3.46t3.46-8.85V-646ZM550.77-298.46Q580-327.69 580-369.23q0-41.54-29.23-70.77-29.23-29.23-70.77-29.23-41.54 0-70.77 29.23Q380-410.77 380-369.23q0 41.54 29.23 70.77 29.23 29.23 70.77 29.23 41.54 0 70.77-29.23ZM255.39-564.62h328.45v-139.99H255.39v139.99ZM200-646v446-560 114Z"/></svg></button>
        </div>
    </div>
</header>

<main class="layout">
    <!-- 좌측 패널 (액티비티 바 + 내용이 하나로 붙은 플로팅 창) -->
    <aside class="left-panel" id="leftPanel" aria-label="Library">
        <!-- 최좌측 얇은 탭 바 -->
        <nav class="lp-rail" role="tablist" aria-label="Library tabs">
            <!-- 아이콘: Google Material Symbols (Apache 2.0) · weight 300 — 원본은 icons/300/ -->
            <button class="rail-btn on" data-tab="components" role="tab" aria-selected="true" title="Components">

            </button>
            <button class="rail-btn" data-tab="motion" role="tab" aria-selected="false" title="Interactions">
                <!-- gesture -->
                <svg class="ico" viewBox="0 -960 960 960" aria-hidden="true"><path d="M552.08-140q-50.16 0-83.12-33.16Q436-206.31 436-255.62q0-72.15 60.35-129.42 60.34-57.27 149.65-69.57-3.77-43.7-20.12-64.89-16.34-21.19-45.8-21.19-32.31 0-68.08 25.57-35.77 25.58-86.08 86.04-68 82.23-104.11 109.46-36.12 27.23-75.42 27.23-46 0-76.2-33.57Q140-359.54 140-410.46q0-49.39 21.77-102.42 21.77-53.04 71.62-123.2 22.46-31 32.42-51.3 9.96-20.31 9.96-33.62 0-9.69-4.42-14.35-4.43-4.65-12.89-4.65-11.92 0-27.31 11.35-15.38 11.34-35 35.03L140-750q29.69-34.38 59.42-52.19Q229.15-820 258.46-820q41.39 0 69.35 27.77 27.96 27.77 27.96 70 0 27.85-14.42 60.92-14.43 33.08-49.43 82.46-36.84 52.85-54.38 92.89T220-414.15q0 19.3 7.23 30.53 7.23 11.24 19.16 11.24 11.15 0 20.96-6.08 9.8-6.08 28.65-24.77 13-12.85 29.65-32 16.66-19.15 40.35-46.46 63.39-75.77 112.08-107.39 48.69-31.61 101.61-31.61 62.77 0 101.92 43.46 39.16 43.46 44.39 119.54h94.38v80H726q-7.23 108.53-54.46 173.11Q624.31-140 552.08-140Zm1.23-80q36.23 0 60.92-41.31 24.69-41.31 31.16-112.08-52.54 8.7-90.97 43.12Q516-295.85 516-258.46q0 17.46 9.92 27.96 9.93 10.5 27.39 10.5Z"/></svg>
            </button>
        </nav>

        <!-- 탭 내용 (닫히면 폭 0으로 접힘) -->
        <div class="lp-body">
            <div class="lp-head">
                <span class="lp-title" id="lpTitle">Components</span>
                <!-- 자산을 만드는 일이라, 자산이 모이는 이곳에 둔다 -->
                <button class="btn tiny ghost" id="saveCompBtn" title="Save the selected block as a component" hidden disabled>＋ Save selection</button>
            </div>
            <div class="lp-panes">
                <div class="lp-pane" data-pane="components">
                    <div class="lp-cards" id="lpCards"></div>
                </div>
                <div class="lp-pane" data-pane="motion" hidden>
                    <div class="lp-cards" id="lpMotion"></div>
                </div>
            </div>
        </div>
    </aside>

    <section class="stage" id="stage">
        <div class="frameWrap" id="frameWrap">
            <iframe id="frame" title="Preview"></iframe>
        </div>
        <div id="stageOverlay" class="stageOverlay"></div>

        <!-- 캔버스 도구 (커서 상태) — 손이 캔버스를 떠나지 않게 여기에 둔다 -->
        <div class="canvas-tools" role="group" aria-label="Canvas tools">
            <button id="panBtn" class="ct-tool" title="Pan (H)" aria-pressed="false">
                <!-- pan_tool -->
                <svg class="ico" viewBox="0 -960 960 960" aria-hidden="true"><path d="M419.31-70q-27.47 0-51.27-12.35-23.81-12.34-39.65-35.42l-250-366.08 16.3-15.69q15.93-15.92 37.7-17.96 21.76-2.04 39.69 10.65L300-417.77v-361.07q0-12.75 8.63-21.38 8.63-8.62 21.38-8.62 12.76 0 21.37 8.62 8.62 8.63 8.62 21.38v476.61L197.77-415.85l180.08 263.62q6.54 10.31 17.65 16.27 11.12 5.96 23.81 5.96H670q37.61 0 63.81-26.19Q760-182.39 760-220v-530q0-12.75 8.63-21.37 8.63-8.63 21.38-8.63 12.76 0 21.37 8.63Q820-762.75 820-750v530q0 62.15-43.92 106.07Q732.15-70 670-70H419.31Zm34.15-420v-368.84q0-12.75 8.63-21.38 8.63-8.62 21.39-8.62 12.75 0 21.37 8.62 8.61 8.63 8.61 21.38V-490h-60Zm153.46 0v-328.84q0-12.75 8.63-21.38 8.63-8.62 21.39-8.62 12.75 0 21.37 8.62 8.61 8.63 8.61 21.38V-490h-60ZM479.08-310Z"/></svg>
            </button>
            <button id="pickBtn" class="ct-tool on" title="Select (V)" aria-pressed="true">
                <!-- left_click -->
                <svg class="ico" viewBox="0 -960 960 960" aria-hidden="true"><path d="M462.23-260.77q-85.61-7.31-143.92-69.77Q260-393 260-480q0-91.54 64.23-155.77T480-700q87 0 149.46 58.12 62.46 58.11 69.77 143.73L635.62-517q-13-54-55.81-88.5T480-640q-66 0-113 47t-47 113q0 57 34.69 100T443-324l19.23 63.23ZM805.61-94.23 624.23-276l-43.46 131.38L480-480l335.38 100.77L684-335.77l181.77 181.38-60.16 60.16Z"/></svg>
            </button>
            <button id="moveBtn" class="ct-tool" title="Move sections (M) — reorder top-level blocks" aria-pressed="false">
                <!-- swap_vert -->
                <svg class="ico" viewBox="0 -960 960 960" aria-hidden="true"><path d="M336.16-453.85v-291.23L222.77-631.69 180-673.85 366.15-860l186.16 186.15-42.77 42.16-113.39-113.39v291.23h-59.99ZM593.46-100 407.31-286.15l42.77-42.16 113.38 113.39v-291.23h60v291.23l113.39-113.39 42.76 42.16L593.46-100Z"/></svg>
            </button>
        </div>

        <div class="stageInfo" id="stageInfo"></div>
    </section>

    <aside class="panel" id="panel">
        <div class="panel-head">Inspector</div>

        <!-- 요소를 고르지 않아도 쓰는 페이지 전체 설정 -->

        <!-- 아무것도 고르지 않았을 때 — 이 패널은 '페이지 전체'를 다룬다.
             요소를 고르면 그 요소로 바뀐다. (접어 두면 못 찾는다는 걸 겪었다) -->
        <div id="emptyState">
            <!-- 파일 경로는 좌상단에 이미 있으므로 다시 쓰지 않는다 -->
            <details class="fold" id="pageBg" open>
                <summary>Page background</summary>
                <div class="fold__body" id="pageBgBody"></div>
            </details>

            <details class="fold" id="pageLayoutFold" open>
                <summary>Layout</summary>
                <div class="fold__body">
                    <div id="pageLayout"></div>
                    <!-- 섹션 사이 간격도 '페이지가 놓이는 틀'이라 같은 묶음에 둔다 -->
                    <label class="sp-row sp-toggle">
                        <span class="sp-check">
                            <input type="checkbox" id="gapShow"> Show spacing in preview
                        </span>
                    </label>
                    <div class="sp-exc" id="gapExc" hidden>
                        <button class="sp-exc__sum" id="gapExcSum" type="button">
                            <b>0</b> sections set their own
                        </button>
                        <div class="sp-exc__list" id="gapExcList" hidden></div>
                    </div>
                <div class="sp-row" id="gapScopeRow" hidden>
                    <span>Drag applies to</span>
                    <div class="seg" id="gapScope">
                        <button data-scope="all" class="on">All</button>
                        <button data-scope="one">This edge</button>
                    </div>
                </div>
                </div>
            </details>


        </div>

        <div id="inspector" hidden>
            <div class="selHead">
                <div class="selTag" id="selTag"></div>
            </div>
            <!-- 이 패널은 '값을 고치는 곳'이다.
                 복제·삭제는 캔버스로, 컴포넌트 등록은 라이브러리로 보냈다.
                 바깥 덩어리는 그 여백을 클릭하면 잡히므로 따로 버튼을 두지 않는다. -->
            <div class="selMeta" id="selMeta"></div>

            <div class="modeRow">
                <span>Change</span>
                <div class="seg" id="modeSeg">
                    <button data-mode="css" class="on">All like this</button>
                    <button data-mode="inline">Only this</button>
                </div>
            </div>

            <div id="fields"></div>

        </div>
    </aside>
</main>

<div id="dsView" class="ds-view" hidden>
    <div class="ds-toolbar">
        <span class="grow"></span>
        <span id="dsDirty" class="ds-dirty" hidden>Changed <b id="dsDirtyCount">0</b></span>
        <button id="dsRevert" class="ct-tool ct-tool--bar" disabled title="Undo" aria-label="Undo"><svg class="ico" viewBox="0 -960 960 960" aria-hidden="true"><path d="M288.08-220v-60h287.07q62.62 0 107.77-41.35 45.16-41.34 45.16-102.11 0-60.77-45.16-101.93-45.15-41.15-107.77-41.15H294.31l111.3 111.31-42.15 42.15L180-596.54 363.46-780l42.15 42.15-111.3 111.31h280.84q87.77 0 150.35 58.58t62.58 144.5q0 85.92-62.58 144.69Q662.92-220 575.15-220H288.08Z"/></svg></button>
        <button id="dsSave" class="btn primary" disabled title="Save" aria-label="Save"><svg class="ico" viewBox="0 -960 960 960" aria-hidden="true"><path d="M820-671.54v459.23Q820-182 799-161q-21 21-51.31 21H212.31Q182-140 161-161q-21-21-21-51.31v-535.38Q140-778 161-799q21-21 51.31-21h459.23L820-671.54ZM760-646 646-760H212.31q-5.39 0-8.85 3.46t-3.46 8.85v535.38q0 5.39 3.46 8.85t8.85 3.46h535.38q5.39 0 8.85-3.46t3.46-8.85V-646ZM550.77-298.46Q580-327.69 580-369.23q0-41.54-29.23-70.77-29.23-29.23-70.77-29.23-41.54 0-70.77 29.23Q380-410.77 380-369.23q0 41.54 29.23 70.77 29.23 29.23 70.77 29.23 41.54 0 70.77-29.23ZM255.39-564.62h328.45v-139.99H255.39v139.99ZM200-646v446-560 114Z"/></svg></button>
    </div>

    <div class="ds-canvas" id="dsCanvas">
        <div class="ds-loading" id="dsLoading">Loading…</div>
    </div>

    <!-- 저장 확인 모달 -->
    <div id="dsConfirm" class="ds-confirm" hidden>
        <div class="ds-confirm-box">
            <h3>These :root values in tokens.css will change</h3>
            <p class="ds-confirm-note">Comments and other blocks stay as they are; only the values below are updated. A backup is kept.</p>
            <div id="dsConfirmList" class="ds-confirm-list"></div>
            <div class="ds-confirm-actions">
                <button id="dsConfirmCancel" class="btn ghost">Cancel</button>
                <button id="dsConfirmOk" class="btn primary">Save tokens.css</button>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/__app/app.js" type="module"></script>
</body>
</html>
